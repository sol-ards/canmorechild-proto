function dPlus(){ const rs=records(); if(!rs.length) return 0; const first=rs.map(r=>r.d).sort()[0]; return dayDiff(first,TODAY)+1; }
function recDays(){ return new Set(records().map(r=>r.d)).size; }
function unlockedThemes(){
  const R=recDays(); const U=R>=1?Math.min(15,1+Math.floor(R/2)):0;
  return new Set([...BASE_UNLOCK,...UNLOCK_ORDER.slice(0,U)]);
}
function nextUnlockIn(idx){ // UNLOCK_ORDER 내 idx(0-base) 해금까지 남은 기록일
  const R=recDays(); const k=idx+1; const need=k===1?1:2*(k-1);
  return Math.max(1,need-R);
}
// 직전 기록 비교 태그 (표① — 최근 7일 내 G1+ 직전 기록)
function trendTag(rec){
  const rs=g1p(records()).filter(r=>r.sym===rec.sym && (r.d<rec.d||(r.d===rec.d&&r.t<rec.t)) && dayDiff(r.d,rec.d)<=7);
  if(!rs.length) return null;
  rs.sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t));
  const p=rs[0].g;
  return rec.g>p?'상승 ↗':(rec.g===p?'유지 →':'호전 ↘');
}
function streak(sym){ // 오늘 포함 연속 기록 일수 (각 날 G1+)
  let n=0,d=TODAY;
  while(g1p(records()).some(r=>r.sym===sym&&r.d===d)){n++;d=addDays(d,-1);}
  return n;
}
// 주간 리포트 (표②)
function weekReport(){
  const rs=g1p(records());
  const tw=rs.filter(r=>dayDiff(r.d,TODAY)<=6&&dayDiff(r.d,TODAY)>=0);
  const lw=rs.filter(r=>{const k=dayDiff(r.d,TODAY);return k>=7&&k<=13;});
  const first=records().map(r=>r.d).sort()[0];
  if(!first||dayDiff(first,TODAY)+1<8) return null;
  const syms=[...new Set([...tw,...lw].map(r=>r.sym))];
  const stat=s=>{
    const a=lw.filter(r=>r.sym===s), b=tw.filter(r=>r.sym===s);
    return {sym:s,a:a.length,b:b.length,Gx:Math.max(0,...a.map(r=>r.g)),Gy:Math.max(0,...b.map(r=>r.g)),
      recent:b.length?b.map(r=>r.d+r.t).sort().pop():(a.length?a.map(r=>r.d+r.t).sort().pop():'')};
  };
  const st=syms.map(stat);
  const neu=st.filter(x=>x.a===0&&x.b>=1);
  const wor=st.filter(x=>x.a>=1&&x.b>=1&&(x.b>x.a||x.Gy>x.Gx));
  const calm=st.filter(x=>x.a>=1&&x.b===0);
  const srt=(arr,gk,ck)=>arr.sort((p,q)=>q[gk]-p[gk]||q[ck]-p[ck]||q.recent.localeCompare(p.recent));
  srt(neu,'Gy','b');srt(wor,'Gy','b');srt(calm,'Gx','a');
  const changed=[...neu.map(x=>({...x,tag:'new'})),...wor.map(x=>({...x,tag:'worse'})),...calm.map(x=>({...x,tag:'calm'}))];
  // TOP3
  const cnt={};tw.forEach(r=>cnt[r.sym]=(cnt[r.sym]||0)+1);
  const top=Object.keys(cnt).map(s=>({sym:s,n:cnt[s],g:Math.max(...tw.filter(r=>r.sym===s).map(r=>r.g)),
    recent:tw.filter(r=>r.sym===s).map(r=>r.d+r.t).sort().pop()}))
    .sort((p,q)=>q.n-p.n||q.g-p.g||q.recent.localeCompare(p.recent)).slice(0,3);
  // 최고 등급
  const gmax=Math.max(0,...tw.map(r=>r.g));
  let peak=[];
  if(gmax>=1){
    const ps={};
    tw.filter(r=>r.g===gmax).forEach(r=>{if(!ps[r.sym]||ps[r.sym]<r.d)ps[r.sym]=r.d;});
    peak=Object.keys(ps).map(s=>({sym:s,d:ps[s],n:cnt[s]})).sort((p,q)=>q.n-p.n||q.d.localeCompare(p.d));
  }
  const A=lw.length,B=tw.length,GA=Math.max(0,...lw.map(r=>r.g)),GB=gmax;
  if(!changed.length&&!top.length&&!peak.length) return null;
  return {changed,top,peak,gmax,A,B,GA,GB};
}
// 진료노트 집계 (최근 7일 G2+, 통증 계열 제외)
function noteSummary(){
  const tw=records().filter(r=>r.g>=2&&!PAIN_SYMS.includes(r.sym)&&dayDiff(r.d,TODAY)<=6&&dayDiff(r.d,TODAY)>=0);
  const m={};
  tw.forEach(r=>{(m[r.sym]=m[r.sym]||[]).push(r);});
  return Object.keys(m).map(s=>{
    const list=m[s].sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t));
    return {sym:s,en:EN[s]||s,g:Math.max(...list.map(r=>r.g)),n:list.length,list,
      photos:list.some(r=>r.photos),recent:list[0].d+list[0].t};
  }).sort((p,q)=>q.g-p.g||q.n-p.n||q.recent.localeCompare(p.recent));
}

function childState(){
  const rs=records();
  if(!rs.length) return 'first';
  const today=rs.filter(r=>r.d===TODAY);
  if(today.length) return today.some(r=>r.g>=3)?'g3':'done';
  const last=rs.map(r=>r.d).sort().pop();
  if(dayDiff(last,TODAY)>=7) return 'comeback';
  return 'none';
}
function pickCopy(state){
  let pool;
  if(S.copyOverride){
    pool=COPY[S.copyOverride];
  }else if(state==='none'){
    const h=new Date().getHours();
    pool=h>=5&&h<11?COPY.morning:h>=11&&h<17?COPY.day:COPY.evening;
  }else pool=COPY[state==='first'?'first':state==='g3'?'g3':state==='done'?'done':'comeback'];
  let cand=pool.filter(c=>c!==S.lastCopy);
  if(!cand.length)cand=pool;
  const c=cand[Math.floor(Math.random()*cand.length)];
  S.lastCopy=c;
  return c.replace(/\{n\}야/g,nameJosa(CHILD,'아야')).replace(/\{n\}가/g,nameJosa(CHILD,'이가')).replace(/\{n\}/g,CHILD);
}

    const n=SV.score||0;

        <div style="font-size:19px;font-weight:800;line-height:1.5;margin-top:12px;word-break:keep-all;">${esc(nameJosa(CHILD,'아야'))}, 오늘 기록이야<br>${todayTimes?`오늘 ${todayTimes}번 기록했어`:'오늘은 아직 기록이 없어'}</div>

        const lines=g0only
          ?`<div class="frow">${faceSVG(0,17)}<span>${d===TODAY?'힘든 증상이 없어요':'이날은 힘든 증상이 없었어'}</span></div>`
          :list.slice().sort((a,b)=>b.g-a.g).map(r=>`<div class="frow">${faceSVG(r.g,17)}<span>${esc(r.sym)} - ${FACE[r.g][2]}</span></div>`).join('');

      }).join('');
      return `<div class="daylabel">🗓 ${label}</div>${cards}`;
    }).join('');
    return topbar('기록 모아보기')+`<div class="scr-body">${header}${groups}</div>`;
  }
  // 보호자 — 파란 테두리 오늘 카드 + 일자별 카드
  const gpill=g=>`<span style="background:${GCOLOR[g]};color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 8px;flex:none;line-height:1.5;">G${g}</span>`;
  const groupHtml=d=>Object.keys(days[d]).sort().reverse().map((t,i)=>{
    const list=days[d][t];
    const mg=list.filter(r=>r.g>=1).sort((a,b)=>b.g-a.g)[0];
    const rows=list.slice().sort((a,b)=>b.g-a.g).map(r=>`<div class="grow">${gpill(r.g)}<span>${r.g===0?'증상 없음':esc(r.sym)}</span></div>`).join('');
    return `<div style="${i?'border-top:1px solid #f1f3f5;margin-top:12px;padding-top:12px;':''}">
      <div style="font-size:12.5px;color:#98a2ad;font-weight:600;">${t}</div>${rows}
      ${mg?`<div style="text-align:right;margin-top:2px;"><span style="color:#4A80F0;font-size:12.5px;font-weight:700;cursor:pointer;" onclick="go(scrSymDetail,'${esc(mg.sym)}',${mg.g},'record')">관리법 ›</span></div>`:''}
    </div>`;
  }).join('');
  const chip=`<span style="background:#e8f0fe;color:#4A80F0;font-size:11px;font-weight:800;border-radius:9px;padding:2px 9px;flex:none;">기록 D+${dPlus()}</span>`;
  const todayCard=`<div style="background:#fff;border:1.5px solid #4A80F0;border-radius:17px;padding:15px 17px;">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:16px;font-weight:800;">오늘 ${esc(CHILD)}의 기록</span>${chip}</div>
    <div style="font-size:12px;color:#98a2ad;margin-top:2px;">${fmtD(TODAY)}</div>
    ${days[TODAY]?`<div style="margin-top:12px;">${groupHtml(TODAY)}</div>`
      :`<div style="font-size:13px;color:#8a95a1;padding:14px 0 6px;">오늘은 아직 기록이 없어요. 기록하도록 안내해 주세요.</div>`}
  </div>`;
  const past=dayKeys.filter(d=>d!==TODAY).map(d=>{
    const label=dayDiff(d,TODAY)===1?`어제 · ${fmtD(d)}`:fmtD(d);
    return `<div class="daylabel" style="color:#5a6470;">${label}</div><div class="rec">${groupHtml(d)}</div>`;
  }).join('');
  const iBtn=`<button class="act" style="width:26px;height:26px;border-radius:50%;border:1.5px solid #22303a;color:#22303a;background:none;font-size:13px;" onclick="showGradeSheet()">ⓘ</button>`;
  return topbar('기록 모아보기',{right:iBtn})+`<div class="scr-body">${todayCard}${past}</div>`;
}

/* ================= 증상 관리 상세 ================= */
function scrSymDetail(sym,recG,from,tabSyms){
  const child=S.mode==='child';
  let tabs=tabSyms;
  if(!tabs){
    if(from==='record'){
      const rs=g1p(records()).filter(r=>r.d===TODAY);
      tabs=[...new Set(rs.sort((a,b)=>b.g-a.g).map(r=>r.sym))];
      if(!tabs.includes(sym)) tabs=[sym];
    }else tabs=[sym];
  }
  const accent=child?'var(--teal)':'#4A80F0';
  const tabBar=tabs.length>1?`<div class="tabscroll">${tabs.map(s=>`<button class="ttab" style="${s===sym?`background:${accent};color:#fff;`:''}" onclick="replaceDetail('${esc(s)}','${from}')">${esc(s)}</button>`).join('')}</div>`:'';

  if(child){
    const cg=CHILD_GUIDE[sym];
    const heroRaw=cg?cg.hero.replace('{n}야',nameJosa(CHILD,'아야')):`${nameJosa(CHILD,'아야')}, 힘들 때는 이렇게 해봐`;
    const ci=heroRaw.indexOf(',');
    const hero1=ci>0?heroRaw.slice(0,ci+1):heroRaw, hero2=ci>0?heroRaw.slice(ci+1).trim():'';
    const tit=cg?cg.tit:`${sym} 증상이 있을 때`;
    const text=cg?cg.text:(DATA.guide[sym]?.['G'+recG]||Object.values(DATA.guide[sym]||{})[0]||'지침 준비 중이에요.');
    return topbar('증상 관리법')+`
    <div class="scr-body">
      ${tabBar}
      <div class="card" style="padding:24px 18px 18px;text-align:center;">
        <div style="font-size:17px;font-weight:800;line-height:1.55;word-break:keep-all;">${esc(hero1)}${hero2?`<br>${esc(hero2)}`:''}</div>
        <img src="${asset('guidechar')}" alt="" style="width:150px;margin:14px 0 0;">
        <div style="background:#f0f0f3;border-radius:13px;padding:15px 16px;text-align:left;">
          <div style="font-size:14px;font-weight:800;color:#e0752a;">${esc(tit)}</div>
          <div style="font-size:12.5px;line-height:1.8;color:#3a4a52;margin-top:8px;white-space:pre-line;">${esc(text)}</div>
        </div>
        ${cg&&cg.warn?`<div style="background:#fdeee2;border-radius:13px;padding:13px 15px;text-align:left;font-size:12.5px;line-height:1.7;color:#c9611a;font-weight:600;margin-top:10px;">${esc(cg.warn)}</div>`:''}
      </div>
    </div>`;
  }

  const grades=gradesOf(sym);
  const recGrade='G'+recG;
  let order;
  if(from==='ency') order=grades;
  else order=[recGrade,...grades.filter(g=>g!==recGrade)];
  order=order.filter(g=>DATA.guide[sym]&&DATA.guide[sym][g]);
  const cards=order.map((g,i)=>{
    const gn=+g.slice(1);
    return `<div class="gcard ${i===0&&from!=='ency'?'cur':''}">
      <div class="h" style="color:#4A80F0;">집에서 이렇게 관리해요 <span class="gpill" style="background:${GCOLOR[gn]}">${g}</span></div>
      <div class="g">${esc(DATA.guide[sym][g])}</div></div>`;
  }).join('');
  const media=contentsOf(sym).map((c,i)=>`
    <div class="media" onclick="openViewer('${c.l}','${esc(c.title).replace(/'/g,'&#39;')}','${esc(sym)}')">
      <span style="font-size:15px;flex:none;${i?'filter:grayscale(1);opacity:.35;':''}">⭐</span>
      <span style="width:36px;height:36px;border-radius:9px;background:#eceef1;flex:none;"></span>
      <span class="tx"><div class="t">${esc(c.title)}</div><div class="s">${c.l}</div></span>
      <span class="ar">›</span></div>`).join('');
  return topbar('증상 관리법',{right:`<button class="act" style="width:26px;height:26px;border-radius:50%;border:1.5px solid #22303a;color:#22303a;background:none;font-size:13px;" onclick="showGradeSheet()">ⓘ</button>`})+`
  <div class="scr-body">
    ${tabBar}
    <div class="swipe-row">${cards}</div>
    <div class="dots">${order.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>
    ${media?`<div style="display:flex;flex-direction:column;gap:8px;">${media}</div>`:''}
  </div>`;
}
function replaceDetail(sym,from){
  const rs=g1p(records()).filter(r=>r.sym===sym).sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t));
  const g=rs.length?rs[0].g:1;
  const top=S.stack[S.stack.length-1];
  S.stack[S.stack.length-1]={fn:scrSymDetail,args:[sym,g,from,top.args[3]||top.args&&null]};
  // 탭 유지
  const prevTabs=top.args[3]||null;
  S.stack[S.stack.length-1].args=[sym,g,from,prevTabs||undefined];
  render();
}

function encyFilter(q){

      <div style="font-size:11px;color:var(--mut);margin-top:2px;">${period}</div></div>

        <span style="font-size:14px;font-weight:800;">보호자 노트</span>

let memoEdit=false;
function openMemo(d,from){ memoEdit=false; S.memoFrom=from; go(scrMemo,d); }

  const memo=memos().find(m=>m.d===d);

    <div style="font-size:11.5px;color:var(--mut);font-weight:700;">${d===TODAY?'오늘':fmtMD(d)} 기록된 증상</div>
    <div class="chips">${todayRecs.map(r=>`<span class="chip" style="background:#f5f2ea;color:#5a5344;">
      <span class="gchip" style="background:${GCOLOR[r.g]};font-size:10px;padding:1px 7px;margin-right:5px;">G${r.g}</span>${esc(r.sym)}</span>`).join('')}</div></div>`:'';
  const dObj=new Date(d+'T00:00:00');
  const dLabel=`${dObj.getFullYear()}년 ${dObj.getMonth()+1}월 ${dObj.getDate()}일 ${WD[dObj.getDay()]}요일`;
  const rightBtn=editing
    ?`<button class="act" onclick="saveMemo('${d}')">✓</button>`
    :`<button class="act" style="color:#8a95a1;" onclick="memoMenu('${d}')">⋯</button>`;
  const backFn=S.memoFrom==='cal'?'back()':'back()';
  return topbar('메모',{right:rightBtn})+`
  <div class="scr-body">
    <div class="memo-date"><span class="d">${dLabel}</span><span class="cal" onclick="go(scrMemoCal,'${d.slice(0,7)}')">📅</span></div>
    ${chipsHtml}
    <div class="memo-body">
      ${editing
        ?`<textarea id="memotext" maxlength="300" placeholder="오늘 기록된 증상, 궁금한 점이 있었나요?\n진료 때 물어볼 질문이나 참고할 내용을 남겨 보세요." oninput="document.getElementById('memocnt').textContent=this.value.length+'/300'">${memo?esc(memo.text):''}</textarea>`
        :`<div style="font-size:13.5px;line-height:1.75;flex:1;">${esc(memo.text)}</div>`}
      ${memo&&memo.photos?`<div class="memo-thumbs">${Array.from({length:memo.photos},()=>'<i>🖼️</i>').join('')}</div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;">
        <span class="cnt" id="memocnt">${(memo?memo.text.length:0)}/300</span>
        ${editing?`<span class="photo" style="position:static;"><span class="b" onclick="addMemoPhoto('${d}')">🖼</span><span class="c" id="memophc">${memo&&memo.photos?memo.photos:0}/3</span></span>`:''}
      </div>
    </div>
  </div>`;
}
let pendingPhotos=null;
function addMemoPhoto(d){
  const memo=memos().find(m=>m.d===d);
  const cur=pendingPhotos!==null?pendingPhotos:(memo?memo.photos:0);
  if(cur>=3){toast('사진은 최대 3장까지예요');return;}
  pendingPhotos=cur+1;
  document.getElementById('memophc').textContent=pendingPhotos+'/3';
  toast('사진을 첨부했어요 (프로토타입)');
}
function saveMemo(d){
  const text=document.getElementById('memotext').value.trim();
  if(!text&&!pendingPhotos){toast('내용을 입력해 주세요');return;}
  let memo=memos().find(m=>m.d===d);
  if(memo){memo.text=text;if(pendingPhotos!==null)memo.photos=pendingPhotos;}
  else S.memos.push({d,text,photos:pendingPhotos||0,new:true});
  pendingPhotos=null;memoEdit=false;
  toast('메모를 저장했어요');render();
}
function memoMenu(d){

    <button onclick="memoEdit=true;closeOv();render();">편집하기</button>
    <button class="danger" onclick="confirmDelMemo('${d}')">삭제하기</button></div>`);
}
function confirmDelMemo(d){
  pop(`<div class="pop"><div class="t">이 메모를 삭제할까요?</div>
    <div class="btns"><button class="no" onclick="closeOv()">아니오</button>

}
function scrMemoCal(ym){
  const [y,m]=ym.split('-').map(Number);
  const firstDay=new Date(y,m-1,1).getDay();
  const dim=new Date(y,m,0).getDate();
  const dimPrev=new Date(y,m-1,0).getDate();
  const memoDays=new Set(memos().map(x=>x.d));
  let cells='';
  for(let i=firstDay-1;i>=0;i--)cells+=`<span class="off">${dimPrev-i}</span>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls=[memoDays.has(ds)?'dot':'',ds===TODAY?'sel':''].join(' ');
    cells+=`<span class="${cls}" onclick="calTap('${ds}')">${ds===TODAY?`<i>${d}</i>`:d}</span>`;
  }
  const rem=(firstDay+dim)%7;
  if(rem)for(let d=1;d<=7-rem;d++)cells+=`<span class="off">${d}</span>`;
  const prev=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`;
  const next=m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`;
  return topbar('메모')+`
  <div class="scr-body">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:15px;font-weight:800;">${y}년 ${m}월</span>
        <span style="font-size:14px;color:#8a95a1;">
          <button onclick="calNav('${prev}')" style="padding:3px 7px;">‹</button>
          <button onclick="calNav('${next}')" style="padding:3px 7px;">›</button></span>
      </div>
      <div class="cal-grid">
        ${WD.map(w=>`<span class="wd">${w}</span>`).join('')}${cells}
      </div>
    </div>
  </div>`;
}
function calNav(ym){ S.stack[S.stack.length-1]={fn:scrMemoCal,args:[ym]}; render(); }
function calTap(ds){
  const has=memos().some(m=>m.d===ds);
  if(ds>TODAY&&!has){pop(`<div class="pop"><div class="t">작성한 메모가 없어요.</div>
    <div class="btns"><button class="yes" onclick="closeOv()">확인</button></div></div>`);return;}
  memoEdit=false;S.memoFrom='cal';go(scrMemo,ds);
}

/* ================= 뷰어 ================= */
const viewer=document.getElementById('viewer');
let vTimer=null;
function closeViewer(){ viewer.classList.remove('show'); viewer.classList.remove('blog'); viewer.innerHTML=''; if(vTimer){clearInterval(vTimer);vTimer=null;} }
function openViewer(type,title,sym){
  if(type==='동영상')openVideo(title);
  else if(type==='블로그')openBlog(title,sym);
  else openCards(title);
}
function openVideo(title){
  let pos=0,playing=true;const DUR=71;
  viewer.innerHTML=`
  <div class="vtop"><span class="brand">ⓒ canmore</span><span class="x" id="vx" style="visibility:hidden;" onclick="closeViewer()">✕</span></div>
  <div class="stage" id="vstage">
    <div class="vbub">${esc(title)}</div>
    <div class="vchar" id="vchar">🧑‍⚕️</div>
    <div class="vsub">증상이 있을 때는 무리하지 말고<br>편안한 자세로 휴식을 취해 보세요</div>
    <div class="vover" id="vover" style="display:none;"><span class="vplay" id="vplay">▶</span></div>
  </div>
  <div class="vbot">
    <div class="vbar"><i id="vfill" style="width:0%"></i><u id="vknob" style="left:0%"></u></div>
    <div class="vmeta"><span class="tm" id="vtime">00:00 / 01:11</span>
      <button class="sumbtn" onclick="event.stopPropagation();videoSum('${esc(title).replace(/'/g,'&#39;')}')">📄 영상 요약</button></div>
    <div class="vtitle">${esc(title)}</div>
  </div>`;
  viewer.classList.add('show');
  const fill=viewer.querySelector('#vfill'),knob=viewer.querySelector('#vknob'),time=viewer.querySelector('#vtime');
  const stage=viewer.querySelector('#vstage'),over=viewer.querySelector('#vover'),x=viewer.querySelector('#vx'),ch=viewer.querySelector('#vchar');
  const draw=()=>{const p=Math.min(100,pos/DUR*100);fill.style.width=p+'%';knob.style.left=p+'%';
    time.textContent=`${String(Math.floor(pos/60)).padStart(2,'0')}:${String(Math.floor(pos%60)).padStart(2,'0')} / 01:11`;};
  vTimer=setInterval(()=>{if(playing){pos+=0.5;draw();
    if(pos>=DUR){playing=false;over.style.display='flex';viewer.querySelector('#vplay').textContent='↺';x.style.visibility='visible';ch.style.opacity=.4;}}},500);
  stage.addEventListener('click',e=>{
    if(e.target.closest('.vplay')){ if(pos>=DUR)pos=0; playing=true;over.style.display='none';x.style.visibility='hidden';ch.style.opacity=1;return;}
    if(playing){playing=false;over.style.display='flex';viewer.querySelector('#vplay').textContent='▶';x.style.visibility='visible';ch.style.opacity=.4;}
  });
}
function videoSum(title){
  sheet(`<h3>${esc(title)}</h3>
  <div style="font-size:12.5px;line-height:1.8;color:#3a4a52;margin-top:10px;">
  「<b>식사 후에는 차분하고 조용한 환경에서 편안한 자세로 휴식</b>을 취해 보세요. 단, 식사 후 바로 누울 경우 음식이 역류할 수 있으니 상체를 높이고 안정을 취하시길 바랍니다.」<br><br>
  「증상이 심해질 때는 <b>긴장을 풀고 천천히 심호흡</b>을 하고 <b>머리나 목에 차가운 수건</b>을 얹어 놓으면 도움이 됩니다.」</div>
  <button style="width:100%;background:#1a73e8;color:#fff;font-size:13.5px;font-weight:800;border-radius:12px;padding:13px 0;margin-top:16px;" onclick="closeOv()">확인했어요</button>`);
}
function openBlog(title,sym){
  const fever=sym==='열';
  viewer.innerHTML=`
  <div class="vtop"><span class="brand">ⓒ canmore</span><span class="x" onclick="closeViewer()">✕</span></div>
  <div class="stage" style="justify-content:flex-start;overflow-y:auto;gap:10px;">
    <div class="bhero">${esc(title)}</div>
    <div class="bp">${fever
      ?'정상 체온의 범위는 구강에서 측정한 온도를 기준으로 보통 35.8~37.2도이며, 발열은 열이 오르는 시간이나 형태에 따라 다양하게 나타납니다. 항암 치료 중에는 작은 발열도 중요한 신호일 수 있어 주의 깊게 살펴야 합니다.'
      :'증상의 원인과 관리 방법을 이해하기 쉽게 정리한 블로그 콘텐츠입니다. 이미지와 텍스트를 세로 스크롤로 이어 볼 수 있어요.'}</div>
    ${fever?`<div class="bh">발열의 원인은?</div>
    <div class="bp">백혈구의 한 종류인 호중구는 세균이 우리 몸을 침범했을 때 이를 파괴하여 감염의 위험을 줄여줍니다. 항암 치료로 호중구가 줄어들면 감염에 취약해지고, 발열이 그 첫 신호가 될 수 있습니다.</div>`:''}
    <div style="font-size:11px;font-weight:800;color:#8a95a1;padding:4px 0 14px;">▾ 세로 스크롤로 본문 이어 보기</div>
  </div>`;
  viewer.classList.add('show');viewer.classList.add('blog');
}
function openCards(title){
  let idx=1;const total=7;
  const draw=()=>{
    viewer.querySelector('#ccont').innerHTML=`
      <div class="ccard"><span class="e">${['🥗','💧','🛌','🍵','🚶','🧘','✅'][idx-1]}</span>
        <div class="t">${esc(title)}</div>
        <div class="s">이미지 조합 카드 (인스타그램 카드뉴스 형태)<br>좌우 스와이프로 이동</div></div>`;
    viewer.querySelector('#cind').textContent=`${idx} / ${total}`;
  };
  viewer.innerHTML=`
  <div class="vtop"><span class="brand">ⓒ canmore</span><span class="x" onclick="closeViewer()">✕</span></div>
  <div class="stage" id="ccont"></div><div class="vind" id="cind" style="padding-bottom:26px;"></div>`;
  viewer.classList.add('show');
  draw();
  let sx=null;
  viewer.querySelector('#ccont').addEventListener('pointerdown',e=>sx=e.clientX);
  viewer.querySelector('#ccont').addEventListener('pointerup',e=>{
    if(sx===null)return;
    const dx=e.clientX-sx;sx=null;
    if(Math.abs(dx)<30){return;}
    if(dx<0&&idx<total)idx++;else if(dx>0&&idx>1)idx--;
    draw();
  });
}

/* ================= 좌측 패널 ================= */
function renderSide(){
  document.getElementById('side-mode').innerHTML=`
    <button class="${S.mode==='guardian'?'on':''}" onclick="S.mode='guardian';home()">👨‍👩‍👧 보호자 모드</button>
    <button class="${S.mode==='child'?'on':''}" onclick="S.mode='child';home()">🧒 환아 모드</button>`;
  const nav=[
    ['홈',()=>home()],
    ['기록 모아보기',()=>{S.stack=[{fn:S.mode==='guardian'?scrGuardianHome:scrChildHome,args:[]}];go(scrRecords);}],
    ['진료노트',()=>{S.stack=[{fn:S.mode==='guardian'?scrGuardianHome:scrChildHome,args:[]}];go(scrNote);}],
  ];
  if(S.mode==='guardian'){
    nav.push(['관리백과',()=>{S.stack=[{fn:scrGuardianHome,args:[]}];go(scrEncy);}]);
    nav.push(['메모',()=>{S.stack=[{fn:scrGuardianHome,args:[]}];openMemo(TODAY,'home');}]);
    nav.push(['응급 신호 기준',()=>{home();showEmergency();}]);
  }else{
    nav.push(['증상 기록하기(문진)',()=>{S.stack=[{fn:scrChildHome,args:[]}];startSurvey();}]);
    nav.push(['홈테마 컬렉션',()=>{S.stack=[{fn:scrChildHome,args:[]}];go(scrThemes);}]);
  }
  document.getElementById('side-nav').innerHTML=nav.map((n,i)=>`<button onclick="SIDE_NAV[${i}]()">${n[0]}</button>`).join('');
  window.SIDE_NAV=nav.map(n=>n[1]);
  document.getElementById('side-scn').innerHTML=[
    ['base','D+42 샘플 데이터'],['today0','오늘 기록 없음'],['fresh','가입 직후 (기록 0건)']
  ].map(([k,l])=>`<button class="${S.scenario===k?'on':''}" onclick="S.scenario='${k}';home()">${l}</button>`).join('');
  const copySec=document.getElementById('side-copy');
  if(S.mode==='child'){
    copySec.parentElement.style.display='';
    copySec.innerHTML=[
      [null,'자동 판정 (기록 상태 기준)'],['first','D+0 첫 진입'],['morning','미기록 · 아침'],['day','미기록 · 낮'],
      ['evening','미기록 · 저녁'],['done','기록 완료'],['g3','G3+ 기록 직후'],['comeback','공백 복귀']
    ].map(([k,l])=>`<button class="${S.copyOverride===k?'on':''}" onclick="S.copyOverride=${k?`'${k}'`:'null'};home()">${l}</button>`).join('');
  }else copySec.parentElement.style.display='none';
}

home();
</script>
