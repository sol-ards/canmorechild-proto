<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캔모어차일드 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --g0:#82ABF5; --g1:#4FB273; --g2:#E8B93E; --g3:#EE8A3C; --g4:#DD5244;
  --teal:#3FB9C0; --navy:#22303a; --guardian:#0277bd; --guardian-bg:#E1F5FE;
  --child:#E09600; --child-bg:#FFF8D6; --gold:#FFCF19;
  --bg:#f7f5f0; --line:#ece7db; --ink:#1d2b38; --soft:#5a6b73; --mut:#98a2ad;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;background:#e8e4da;
  background-image:radial-gradient(#d8d2c4 .7px,transparent .7px);background-size:24px 24px;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:22px 16px;gap:26px;color:var(--ink);}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}

/* ===== 좌측 안내 패널 ===== */
.side{width:230px;flex:none;display:flex;flex-direction:column;gap:10px;}
.side .logo{font-size:12px;font-weight:800;letter-spacing:.14em;color:#2ba3a9;text-transform:uppercase;}
.side h1{font-size:19px;font-weight:800;line-height:1.35;}
.side .meta{font-size:11.5px;color:#6b7680;line-height:1.8;background:#fffdf8;border:1px solid #dcd5c7;border-radius:12px;padding:10px 13px;}
.side .meta b{color:#22303a;}
.side .cap{font-size:11px;font-weight:800;color:#8a8375;margin-top:6px;}
.side .btns{display:flex;flex-direction:column;gap:5px;}
.side .btns button{text-align:left;font-size:12px;font-weight:700;color:#3c4854;background:#fffdf8;border:1px solid #dcd5c7;border-radius:10px;padding:7px 12px;}
.side .btns button:hover{border-color:#2ba3a9;color:#2ba3a9;}
.side .btns button.on{background:#22303a;border-color:#22303a;color:#fff;}
@media(max-width:760px){.side{display:none;}}

/* ===== 폰 프레임 ===== */
.phone{width:393px;height:832px;flex:none;background:#111;border-radius:46px;padding:10px;box-shadow:0 24px 60px rgba(20,30,42,.35);position:relative;}
.screen{width:100%;height:100%;background:var(--bg);border-radius:37px;overflow:hidden;position:relative;}
.notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#111;border-radius:14px;z-index:60;}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--bg);}
.scr.show{display:flex;}
.scr-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none;}
.scr-body::-webkit-scrollbar{display:none;}

/* 상단바 */
.topbar{flex:none;height:88px;padding:52px 16px 0;display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid #eee;}
.topbar.clear{background:transparent;border-bottom:none;}
.topbar .back{font-size:20px;font-weight:800;color:#22303a;padding:2px 8px 2px 0;}
.topbar .tit{font-size:15px;font-weight:800;color:#22303a;flex:1;text-align:center;margin-right:28px;}
.topbar .tit.left{text-align:left;margin-right:0;}
.topbar .act{font-size:17px;font-weight:800;color:var(--teal);padding:2px 4px;}

/* 공통 카드 */
.card{background:#fff;border-radius:18px;padding:15px 16px;box-shadow:0 1px 5px rgba(30,42,56,.06);}
.card.bordered{box-shadow:none;border:1px solid var(--line);}

/* G뱃지 */
.gb{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:800;flex:none;}
.gb.sm{width:23px;height:23px;font-size:9.5px;}
.gpill{display:inline-flex;align-items:center;font-size:10px;font-weight:800;color:#fff;border-radius:7px;padding:2px 8px;flex:none;}

/* 홈 상단 아이콘 행 */
.hometop{display:flex;align-items:center;gap:10px;padding:0 2px;}
.hometop .menu{margin-right:auto;font-size:18px;color:#8a95a1;font-weight:700;}
.hometop .bell{font-size:17px;position:relative;}
.hometop .bell i{position:absolute;top:-1px;right:-3px;width:7px;height:7px;border-radius:50%;background:#DD5244;}
.swap{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:17px;padding:5px 6px;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.08);}
.swap i{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;}
.swap i.onx{background:#F09A3E;color:#fff;}
.swap i.off{background:#eef0f3;color:#b6bcc4;}
.hero-top .hometop .menu{background:#fff;border-radius:11px;width:38px;height:34px;display:flex;align-items:center;justify-content:center;color:#e8963f;font-size:16px;box-shadow:0 2px 7px rgba(0,0,0,.1);}
.hero-top .hometop .bell{background:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 7px rgba(0,0,0,.1);}
.hero-top .swap{background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.1);}
.hometop.gtop .menu,.hometop.gtop .bell{color:#4A80F0;}

/* ===== 보호자 홈 ===== */
.embar{background:#fdecea;border:1px solid #f6b9b1;border-radius:14px;padding:11px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.embar .t{font-size:13px;font-weight:800;color:#e4574f;}
.embar .go{font-size:12px;font-weight:700;color:#e4574f;}
.lead{font-size:13px;font-weight:700;color:#4a5561;}
.sec-tit{display:flex;justify-content:space-between;align-items:baseline;margin-top:3px;}
.sec-tit .t{font-size:15.5px;font-weight:800;}
.sec-tit .s{font-size:12px;color:var(--mut);font-weight:600;cursor:pointer;}
.rrow{display:flex;align-items:center;gap:9px;padding:10px 0 3px;flex-wrap:wrap;}
.rrow .nm{font-size:14.5px;font-weight:800;line-height:1.4;min-width:0;flex:0 1 auto;}
.rrow .nm.mut{font-size:13px;font-weight:600;color:#8a95a1;}
.rrow .tm{font-size:11px;color:var(--mut);font-weight:600;flex:none;}
.rsub{display:flex;align-items:center;gap:7px;padding:2px 0 10px 36px;border-bottom:1px solid #f1f3f5;}
.rsub.last{border-bottom:none;padding-bottom:4px;}
.rtag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:9px;background:#fdecea;color:#e4574f;flex:none;}
.rtag.new{background:#fff3cd;color:#b07d0a;}
.rtag.down{background:#e8f0fe;color:#4A80F0;}
.rgo{font-size:11.5px;font-weight:700;color:var(--guardian);margin-left:auto;cursor:pointer;flex:none;}
.card-foot{border-top:1px solid #f1f3f5;margin-top:9px;padding-top:11px;text-align:right;font-size:13px;font-weight:700;color:var(--guardian);cursor:pointer;}
.rep-lab{font-size:12px;font-weight:800;color:#66707b;margin-top:13px;}
.rep-lab:first-child{margin-top:4px;}
.wrow{display:flex;align-items:center;gap:8px;background:#f5f7f9;border-radius:12px;padding:9px 11px;margin-top:8px;flex-wrap:wrap;}
.wrow .nm{font-size:13.5px;font-weight:800;min-width:0;}
.wdesc{font-size:11px;color:#8a95a1;padding:4px 3px 0 11px;}
.wnote{font-size:11px;color:#a3adb8;margin-top:8px;}
.wmore{display:flex;justify-content:center;align-items:center;border:1px dashed #e0d9c8;border-radius:11px;padding:7px;margin-top:8px;font-size:11.5px;font-weight:700;color:#9aa4af;cursor:pointer;}
.repsum{margin-top:13px;background:#FCF8ED;border-radius:11px;padding:9px 12px;}
.repsum .l{font-size:10.5px;font-weight:800;color:#66707b;}
.repsum .v{font-size:12px;color:#9a6b00;margin-top:2px;font-weight:600;}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;display:flex;align-items:center;justify-content:space-around;background:#4A80F0;border-radius:28px;padding:15px 10px;width:calc(100% - 48px);box-shadow:0 8px 22px rgba(74,128,240,.4);z-index:20;}
.fab button{font-size:13.5px;font-weight:800;color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.fab .dv{width:1px;height:16px;background:rgba(255,255,255,.3);}
.empty-card{text-align:center;padding:34px 16px;}
.empty-card .e{font-size:24px;}
.empty-card .t{font-size:13.5px;font-weight:800;color:#2b3a44;margin-top:8px;}
.empty-card .s{font-size:11.5px;color:#9a9a9a;margin-top:5px;line-height:1.7;}

/* ===== 환아 홈 ===== */
.chero{position:relative;flex:1;min-height:300px;background-size:cover;background-position:center top;display:flex;flex-direction:column;}
.chero.dark::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,18,30,.55) 0%,rgba(8,18,30,.3) 34%,rgba(8,18,30,0) 62%);pointer-events:none;}
.chero>*{position:relative;z-index:1;}
.chero .hero-top{padding:52px 16px 0;}
.chero .copy{padding:12px 20px 0;font-size:19px;font-weight:800;color:#2c3038;line-height:1.55;word-break:keep-all;max-width:340px;
  text-shadow:0 1px 2px rgba(255,255,255,.75),0 0 10px rgba(255,255,255,.6),0 0 22px rgba(255,255,255,.5);}
.chero.dark .copy{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.4);}
.dchip{display:inline-block;background:#fff;color:#3a4048;font-size:12px;font-weight:800;border-radius:15px;padding:5px 13px;box-shadow:0 2px 7px rgba(0,0,0,.1);}
.chero.dark .dchip{background:rgba(255,255,255,.92);}
.chero .theme-btn{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);background:#fff;color:#3a4048;font-size:12.5px;font-weight:800;border-radius:16px;padding:8px 16px;box-shadow:0 3px 10px rgba(0,0,0,.12);}
.chero .theme-btn b{color:#e8963f;}
.ccta{background:#F0964B;border-radius:22px;padding:18px;color:#fff;position:relative;cursor:pointer;box-shadow:0 4px 14px rgba(240,150,75,.35);}
.ccta .em{position:absolute;top:16px;right:18px;font-size:36px;}
.ccta .t{font-size:17px;font-weight:800;}
.ccta .s{font-size:12.5px;opacity:.92;margin-top:3px;}
.ccta .go{display:inline-block;background:rgba(255,255,255,.25);border-radius:16px;padding:6px 14px;font-size:12px;font-weight:800;margin-top:12px;}
.csub{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.csub .b{background:#fff;border-radius:19px;padding:15px 15px 40px;cursor:pointer;text-align:left;position:relative;box-shadow:0 1px 5px rgba(120,90,20,.06);}
.csub .b .t{font-size:14px;font-weight:800;}
.csub .b .s{font-size:11px;color:#9a9a9a;margin-top:3px;}
.csub .b .ci{position:absolute;right:13px;bottom:11px;font-size:18px;}

/* 홈테마 컬렉션 */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.tcell{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:#ddd center/cover;cursor:pointer;border:2.5px solid transparent;}
.tcell img{width:100%;height:100%;object-fit:cover;display:block;}
.tcell.sel{border-color:var(--teal);}
.tcell .chk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.75);color:#bbb;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.tcell.sel .chk{background:var(--teal);color:#fff;}
.tcell.lock img{filter:brightness(.4) saturate(.3);}
.tcell.lock .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;gap:4px;text-align:center;padding:6px;line-height:1.5;}
.tsec{font-size:12.5px;font-weight:800;color:#66707b;margin-top:6px;}

/* ===== 문진 ===== */
.qbub{display:flex;gap:10px;align-items:flex-start;margin-top:8px;}
.qbub img{width:64px;flex:none;}
.qbub .b{background:#fff;border-radius:4px 16px 16px 16px;padding:13px 15px;font-size:14px;font-weight:700;line-height:1.6;box-shadow:0 1px 5px rgba(30,42,56,.08);}
.qopt{background:#fff;border-radius:14px;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 1px 4px rgba(30,42,56,.06);border:1.5px solid transparent;}
.qopt:hover{border-color:var(--teal);}
.qopt .o{width:19px;height:19px;border-radius:50%;border:1.5px solid #ddd;flex:none;}
.qopt.sel{border-color:var(--teal);}
.qopt .o.on{background:var(--teal);border-color:var(--teal);}
.s2grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.s2chip{background:#fff;border:1.5px solid #ddd6e8;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;color:#4a4a5a;cursor:pointer;position:relative;line-height:1.45;text-align:left;word-break:keep-all;}
.s2chip.on{background:#7B5EA7;border-color:#7B5EA7;color:#fff;}
.s2chip .bdg{position:absolute;top:-8px;right:6px;background:var(--teal);color:#fff;font-size:9px;font-weight:800;padding:1px 7px;border-radius:8px;}
.svcta{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 24px;background:linear-gradient(transparent,var(--bg) 40%);z-index:10;}
.svcta button{width:100%;background:var(--teal);color:#fff;font-size:14.5px;font-weight:800;border-radius:27px;padding:15px 0;box-shadow:0 4px 12px rgba(63,182,189,.3);}
.svcta button:disabled{background:#d3d8dd;box-shadow:none;cursor:default;}
.svbasket{display:block;margin:0 auto 9px;width:fit-content;background:#fff;border:1px solid #e0dccf;border-radius:15px;padding:6px 15px;font-size:12px;font-weight:800;color:#5a6b73;cursor:pointer;box-shadow:0 2px 8px rgba(30,42,56,.08);}
.explore-btn{border:1.5px solid var(--child);background:#fff6e0;color:#9a6b00;border-radius:12px;padding:12px;font-size:12.5px;font-weight:800;width:100%;}
.docbub{display:flex;gap:8px;align-items:flex-start;}
.docbub .ic{flex:none;width:30px;height:30px;background:var(--teal);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;}
.docbub .b{background:#fff;border:1.5px solid var(--teal);border-radius:4px 14px 14px 14px;padding:11px 13px;font-size:13.5px;font-weight:700;line-height:1.55;flex:1;}
.svans{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1.5px solid transparent;border-radius:14px;padding:13px 15px;font-size:13px;font-weight:600;line-height:1.6;cursor:pointer;box-shadow:0 1px 4px rgba(30,42,56,.05);}
.svans .tx{white-space:pre-line;flex:1;min-width:0;}
.svans:hover{border-color:var(--teal);}
.rd{width:20px;height:20px;border-radius:50%;border:1.5px solid #ddd;flex:none;background:#fff;}
.on>.rd,.rd.on{background:var(--teal);border-color:var(--teal);box-shadow:inset 0 0 0 3.5px #fff;}
.symrow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid transparent;border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 4px rgba(30,42,56,.05);position:relative;text-align:left;width:100%;}
.symrow.on{border-color:var(--teal);}
.symrow .sq{width:22px;height:22px;border-radius:7px;background:var(--teal);flex:none;opacity:.85;}
.symrow .nm{flex:1;font-size:13.5px;font-weight:700;line-height:1.45;min-width:0;word-break:keep-all;}
.symrow .bdg{position:absolute;top:-8px;right:12px;background:var(--teal);color:#fff;font-size:9px;font-weight:800;padding:1px 7px;border-radius:8px;}
.ppill{background:#fff;border:1.5px solid var(--teal);color:var(--teal);font-size:12px;font-weight:800;border-radius:17px;padding:6px 13px;cursor:pointer;line-height:1.4;word-break:keep-all;}
.ppill.on{background:var(--teal);color:#fff;}
.bodywrap{position:relative;height:400px;}
.bodywrap svg{position:absolute;left:50%;top:34px;transform:translateX(-50%);height:360px;}
.bpin{position:absolute;background:#e9e6df;color:#5a6470;font-size:11.5px;font-weight:700;border-radius:15px;padding:6px 13px;cursor:pointer;white-space:nowrap;z-index:2;}
.bpin:hover{background:var(--teal);color:#fff;}
.svprog{height:5px;background:#e8e4da;border-radius:3px;overflow:hidden;display:block;}
.svprog i{display:block;height:100%;background:var(--teal);border-radius:3px;transition:.25s;}
.bodygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.bodypart{background:#fff;border:1.5px solid #d8cff0;color:#5a3a9a;border-radius:12px;padding:15px 8px;font-size:12.5px;font-weight:800;text-align:center;cursor:pointer;}
.saf{background:#f0f0ee;border-radius:10px;padding:10px 12px;font-size:11.5px;color:#77808a;line-height:1.65;}
.sumchip{background:#f0f9f9;border:1px solid var(--teal);border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:700;color:#0c5a5f;line-height:1.5;}

/* ===== 기록 모아보기 ===== */
.rhero{border-radius:18px;padding:15px 16px;color:#fff;position:relative;}
.rhero.child{background:linear-gradient(180deg,#1A2B4A,#2d6a9f);}
.rhero.guardian{background:linear-gradient(180deg,#01579b,#0288d1);}
.rhero .ico{position:absolute;top:13px;right:13px;}
.rhero .star{width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;}
.rhero .info{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.rhero .dn{font-size:11px;opacity:.8;font-weight:600;}
.rhero .hi{font-size:15px;font-weight:800;margin-top:3px;}
.hrec{background:#fff;border-radius:13px;padding:11px 13px;margin-top:10px;color:var(--ink);}
.hrec .tm{font-size:10.5px;color:#9a9a9a;font-weight:600;}
.face{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:15px;line-height:1.4;}
.f0{background:#E3F2FD;color:#1565C0;}.f1{background:#E8F5E9;color:#2E7D32;}
.f2{background:#FFFDE7;color:#F57F17;}.f3{background:#FFF3E0;color:#E65100;}
.f4{background:#FFEBEE;color:#C62828;}
.gchip{display:inline-flex;align-items:center;color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:7px;line-height:1.4;}
.mgbtn{display:inline-block;font-size:11.5px;font-weight:800;border-radius:10px;padding:6px 12px;margin-top:8px;cursor:pointer;}
.mgbtn.child{border:1.5px solid var(--teal);color:var(--teal);}
.mgbtn.child.hot{background:var(--teal);color:#fff;}
.mgbtn.guardian{border:1.5px solid var(--guardian);color:var(--guardian);}
.mgbtn.guardian.hot{background:var(--guardian);color:#fff;}
.daylabel{font-size:12px;font-weight:700;color:#8a8a8a;margin-top:4px;}
.rec{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 14px;}
.rec .tm{font-size:10.5px;color:#9a9a9a;font-weight:600;}
.rec .syms{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-top:6px;}

/* ===== 증상 관리 상세 ===== */
.tabscroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;}
.tabscroll::-webkit-scrollbar{display:none;}
.ttab{flex:none;font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:11px;background:#f0f0f3;color:#8a8f98;cursor:pointer;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.frow{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:700;color:#4a5561;line-height:1.55;margin-top:10px;}
.grow{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:700;margin-top:9px;line-height:1.5;}
.mgfill{background:var(--teal);color:#fff;font-size:12px;font-weight:800;border-radius:9px;padding:8px 14px;margin-top:11px;}
.dhero{background:linear-gradient(180deg,#E09600,#f0ad2a);border-radius:17px;padding:17px 18px;color:#fff;font-size:15.5px;font-weight:800;line-height:1.5;word-break:keep-all;}
.swipe-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:2px 16px;}

.gcard{flex:0 0 87%;scroll-snap-align:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;}

.gcard .h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;}
.gcard .g{font-size:12px;line-height:1.75;color:#3a4a52;margin-top:8px;white-space:pre-line;}
.dots{display:flex;gap:5px;justify-content:center;}
.dots i{width:6px;height:6px;border-radius:3px;background:#d3ccbb;transition:.2s;}
.dots i.on{width:17px;background:#4A80F0;}
.media{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;cursor:pointer;}
.media .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
.media .tx{flex:1;min-width:0;}
.media .t{font-size:12.5px;font-weight:700;line-height:1.45;}
.media .s{font-size:10.5px;color:#9a9a9a;margin-top:1px;}
.media .ar{color:#c9c2b2;font-size:15px;}
.blk{background:#fff;border-radius:15px;padding:14px 15px;box-shadow:0 1px 4px rgba(30,42,56,.06);}
.blk .h{font-size:13.5px;font-weight:800;}
.blk .g{font-size:12.5px;line-height:1.8;color:#3a4a52;margin-top:7px;white-space:pre-line;}

/* ===== 관리백과 ===== */

.search input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;background:none;color:var(--ink);}
.search.on{border:1.5px solid var(--guardian);}
.banner{background:var(--guardian-bg);border-radius:11px;padding:8px 13px;font-size:11px;font-weight:700;color:var(--guardian);line-height:1.6;}
.cnt-row{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px;}
.cnt-row .c{font-size:13px;font-weight:800;color:#2b3a44;}

.gitem .n b{color:var(--guardian);}

.em-why b{color:#B03A2E;}

.vind{font-size:12px;font-weight:800;color:#cfd6de;text-align:center;padding-bottom:6px;}

\n   • 심한 두통이 있는 경우\n   • 의식 변화 또는 발작이 있는 경우\n   • 소변볼 때 불편감이 있는 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 동반된 경우\n5. 다른 증상이 없는 상태로 해열제를 복용해도 38도 이상의 열이 지속되는 경우도 의료진의 신속한 진료가 필요합니다.", "G2": "1. 열감이 있을 때나 으슬으슬 추울 때는 2~3시간마다 체온을 측정해서 기록하세요.\n2. 고열이 지속되는 경우, 미온수나 시원한 수건으로 닦습니다.\n3. 열이 나면 수분 손실이 커지므로 물이나 음료를 충분히 섭취하세요.\n4. 39.1도 이상의 열이 1시간 이상 지속되면서 아래의 증상이 있으면 의료진의 신속한 진료가 필요합니다.\n   • 기침이나 호흡곤란, 누런 가래가 동반되는 경우\n   • 심한 구토 또는 설사가 있는 경우\n   • 카테터(중심 정맥관, 케모포트 등) 부위가 붉어지고 붓고 아픈 경우\n   • 심한 두통이 있는 경우\n   • 의식변화 또는 발작이 있는 경우\n   • 소변볼 때 불편감이 있는 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 동반된 경우\n5. 다른 증상이 없는 상태로 해열제를 복용해도 38도 이상의 열이 지속되는 경우도 의료진의 신속한 진료가 필요합니다.", "G3": "1. 열감이 있을 때나 으슬으슬 추울 때는 2~3시간마다 체온을 측정해서 기록하세요.\n2. 고열이 지속되는 경우, 미온수나 시원한 수건으로 닦습니다.\n3. 열이 나면 수분 손실이 커지므로 물이나 음료를 충분히 섭취하세요.\n4. 40.1도 이상의 열과 함께 아래의 증상이 있으면 의료진의 신속한 진료가 필요합니다.\n   • 기침이나 호흡곤란, 누런 가래가 동반되는 경우\n   • 심한 구토 또는 설사가 있는 경우\n   • 카테터(중심 정맥관, 케모포트 등) 부위가 붉어지고 붓고 아픈 경우\n   • 심한 두통이 있는 경우\n   • 의식 변화 또는 발작이 있는 경우\n   • 소변볼 때 불편감이 있는 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 동반된 경우\n5. 다른 증상이 없는 상태로 해열제를 복용해도 38도 이상의 열이 지속되는 경우도 의료진의 신속한 진료가 필요합니다.", "G4": "1. 열감이 있을 때나 으슬으슬 추울 때는 2~3시간마다 체온을 측정해서 기록하세요.\n2. 고열이 지속되는 경우, 미온수나 시원한 수건으로 닦습니다.\n3. 열이 나면 수분 손실이 커지므로 물이나 음료를 충분히 섭취하세요.\n4. 40.1도 이상의 열과 함께 아래의 증상이 있으면 의료진의 신속한 진료가 필요합니다.\n   • 기침이나 호흡곤란, 누런 가래가 동반되는 경우\n   • 심한 구토 또는 설사가 있는 경우\n   • 카테터(중심 정맥관, 케모포트 등) 부위가 붉어지고 붓고 아픈 경우\n   • 심한 두통이 있는 경우\n   • 의식 변화 또는 발작이 있는 경우\n   • 소변볼 때 불편감이 있는 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 동반된 경우\n5. 다른 증상이 없는 상태로 해열제를 복용해도 38도 이상의 열이 지속되는 경우도 의료진의 신속한 진료가 필요합니다."}, "쉽게 멍이 듦(검거나 푸른 자국)": {"G1": "1. 항응고제 등 출혈을 유발하는 약을 복용 중이라면 의료진에게 문의합니다.\n2. 멍 부위가 점점 커지면 의료진에게 알립니다.\n3. 냉찜질은 혈관을 수축해 피를 멈추게 하므로 먼저 멍이 생긴 부위에 20~30분 동안 얼음주머니로 찜질을 합니다. \n   • 찜질 시 무리하게 문지르지 말고 얼음팩을 천에 싸서 살짝 올려둡니다. \n   • 냉찜질 후 48시간이 지난 후 따뜻한 물을 적신 수건으로 멍 부위에 하루 2~3회 마사지합니다.", "G2": "1. 아래의 경우 의료진의 진료가 필요합니다. \n   • 항암제 투여 후 혈소판 감소로 인해 멍이 많이 들고 출혈 경향이 있는 경우 \n   • 소변에 핑크색 또는 붉은색 피가 섞여 나오는 경우\n   • 검붉은색 또는 붉은색의 혈변\n   • 코피, 구강 출혈이 쉽게 발생하고, 잘 멈추지 않는 경우\n   • 기침이나 구토할 때 피가 나오는 경우\n2. 항응고제 등 출혈을 유발하는 약을 복용 중이라면 의료진에게 문의합니다.\n3. 멍 부위가 점점 커지면 의료진에게 알립니다.\n4. 냉찜질은 혈관을 수축해 피를 멈추게 하므로 먼저, 멍이 생긴 부위에 20~30분 동안 얼음주머니로 찜질을 합니다. \n   • 찜질 시 과도하게 문지르지 말고 얼음팩을 천에 싸서 살짝 올려둡니다. \n   • 냉찜질 후 48시간이 지난 후 따뜻한 물을 적신 수건으로 멍 부위에 하루 2~3회 마사지합니다.", "G3": "없음", "G4": "없음"}, "입마름": {"G1": "1. 구강 상태를 자주 관찰하고 하루 3~4회 양치 후 가글합니다. \n2. 구강 손상을 일으킬 수 있는 문제가 없는지 치과 진료를 받습니다.\n3. 가능하다면 하루 8~10컵의 물을 마십니다.\n4. 음료를 섭취할 때 사레가 걸리지 않도록 음료를 입에 머금고 고개를 약간 앞으로 숙인 상태에서 삼키는 것이 도움이 됩니다. \n5. 과도한 히터나 에어컨 사용과 같은 건조한 환경을 피하고, 가습기를 사용합니다. \n6. 구강에 자극이 될 수 있는 커피, 알코올, 담배 등을 피합니다.", "G2": "1. 증상이 심한 경우 약물 치료가 도움이 될 수 있으므로 의료진과 상의합니다.\n2. 식사 중 소량의 물(반 모금 정도)을 마시면서 섭취해 봅니다. 너무 많은 물을 마시면서 식사를 하면 소화불량의 가능성이 있습니다.\n3. 자기 전에 인공 타액(구강 내에 미끈한 막을 형성)을 사용할 수 있습니다.\n4. 레모네이드와 같은 신맛의 음료수나 소다수, 오렌지 주스, 파인애플, 무가당 사탕 등을 먹거나 껌 등을 씹는 저작 운동은 침 분비를 촉진시킬 수 있습니다.\n5. 마른 과자나 빵 등의 음식보다는 고기 국물이나 소스를 얹은 촉촉한 음식이 도움이 됩니다.\n6. 단백질 보충을 위한 영양 음료를 추가로 마셔 봅니다.", "G3": "1. 입 마름이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 증상이 심하면 진료 후 수액, 인공 타액이나 침샘 분비 촉진제를 처방받을 수 있습니다.\n3. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 입 마름이 매우 심하여 음식 섭취가 불가능한 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 있는 경우\n   • 체중 감소가 동반된 경우", "G4": "없음"}, "입안이 헐어서 아프거나 목이 따가운 증상(구내염)": {"G1": "1. 입안 상태 변화를 자주 관찰해 봅니다. \n2. 양치 후 하루 3~4회 입안을 헹굽니다. 1회 약 30초 가량 시행하며 30분 이내에는 음식 섭취는 피합니다.\n3. 입을 헹구는 용액은 중조가글액 또는 생리식염수를 사용합니다. (알코올이 없는 제품을 사용합니다.)\n4. 스스로 양치질을 할 수 없을 때는 생리식염수를 적신 솜이나 거즈로 입안을 닦거나 고개를 옆으로 한 자세에서 구강용 스펀지를 이용해 입안을 헹굽니다. \n5. 구강에 자극이 될 수 있는 커피, 알코올, 담배 등을 피합니다.\n6. 뜨겁거나 매운 음식, 거친 음식, 신맛나는 자극적인 음식 등은 피합니다.\n7. 틀니는 가능한 식사 시에만 사용하며, 발포성 세정제에 담갔다 헹구어 사용합니다.", "G2": "1. 오한(몸이 춥고 떨림)이 있거나, 몸이 평소와 달리 더 힘들 때, 체온을 측정하여 38도 이상 열이 나면 진료가 필요합니다. \n2. 입안 상태 변화를 자주 관찰합니다.\n3. 중조가글액 또는 생리식염수로 입안을 2시간마다 헹굽니다.\n4. 수분을 자주 섭취하고, 인공 타액을 사용해 볼 수 있습니다.\n5. 음식은 믹서에 갈거나 부드럽게 조리하여 조금씩 자주 먹습니다.\n6. 입안의 통증으로 적절한 식사가 어려울 때는 영양 음료(뉴케어, 하모닐란, 그린비아, 엔커버 등)를 추가로 드세요.\n7. 식전에 얼음을 물고 있거나 국소마취 가글액(가글링 후 물로 헹구지 않음)을 사용하면 통증 완화에 도움이 됩니다.\n8. 출혈이 있다면 찬물로 입을 헹구거나 얼음물에 적신 거즈로 눌러줍니다.", "G3": "1. 구내염이 심하여 스스로 일상생활을 하기가 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우에는 의료진의 신속한 진료가 필요합니다.\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 있는 경우\n   • 구강 통증이 심해서 음식 섭취가 전혀 불가능한 경우\n   • 심각한 체중 감소가 동반되거나 고열과 출혈이 동반되는 경우", "G4": "1. 구내염이 심하여 스스로 일상생활을 하기가 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우에는 의료진의 신속한 진료가 필요합니다.\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 있는 경우\n   • 구강 통증이 심해서 음식 섭취가 전혀 불가능한 경우\n   • 심각한 체중 감소가 동반되거나 고열과 출혈이 동반되는 경우"}, "삼키기 어려움": {"G1": "1. 부드러운 음식을 천천히 삼켜서 먹습니다.\n2. 자주 사레들렸던 음식이나 목에 걸리는 정도의 딱딱하고 덩어리진 음식은 피합니다.", "G2": "1. 부드러운 죽도 삼키기 어렵다면 의료진과의 상담이 필요합니다.\n2. 삼키기 어려운 정도가 점점 심해질 때에도 의료진과의 상담이 필요합니다.\n3. 두경부암이나 식도암으로 방사선 치료를 하는 경우, 일시적인 염증으로 인한 것이므로 몇 주가 지나면 대체적으로 나아집니다.", "G3": "1. 삼키기 어려운 증상이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우에는 의료진의 신속한 진료가 필요합니다.\n   • 음식물 섭취가 불가능한 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 있는 경우\n   • 열과 함께 기침, 가래가 동반되는 경우", "G4": "1. 삼키기 어려운 증상이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우에는 의료진의 신속한 진료가 필요합니다.\n   • 음식물 섭취가 불가능한 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 있는 경우\n   • 열과 함께 기침, 가래가 동반되는 경우"}, "메스꺼움": {"G1": "1. 식사 후에는 30분~1시간 정도 앉아서 휴식을 취하고 눕지 않도록 합니다.\n2. 배의 윗부분을 압박하지 않는 헐렁한 옷을 입도록 합니다.\n3. 음식 냄새를 맡으면 증상이 더 심해질 수 있으니, 환기를 잘 시키고, 가능한 냄새가 나지 않는 음식으로 먹습니다.\n4. 가스가 차거나 변비가 있으면 메스꺼움이 더 심해질 수 있으므로 해당 증상이 있으면 의료진에게 알립니다.", "G2": "1. 처방받은 약(항구토제)이 있다면 용법에 맞게 규칙적으로 복용합니다.\n2. 음식 냄새를 맡으면 증상이 더 심해질 수 있으니 환기를 잘 시키고, 가능한 냄새가 나지 않는 음식으로 먹습니다.\n3. 식사는 소량씩 천천히 자주 먹고, 다음과 같은 음식을 추천합니다.\n   • 자극이 적고 부드러워서 소화가 잘되는 음식\n   • 차가운 음료나 음식, 얼음 조각, 좋아하는 음료수를 얼려서 먹어 봅니다.\n   • 입안에서 나쁜 맛이 느껴질 때에는 박하사탕 등을 천천히 녹여 먹습니다.\n4. 메스꺼워질 때에는 심호흡을 합니다.\n5. 입안을 청결하게 하는 게 도움이 되므로 식사를 하지 않더라도 하루에 2회 이상 양치질을 합니다. \n6. 식사 후에는 30분~1시간 정도 앉아서 휴식을 취하고 눕지 않도록 합니다.", "G3": "1. 메스꺼움이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우가 동반되면 의료진의 신속한 진료가 필요합니다.\n   • 지속적인 메스꺼움으로 인해 경구 섭취가 전혀 불가능한 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 심한 경우", "G4": "없음"}, "속쓰림": {"G1": "1. 과식, 술, 담배, 커피, 매운 음식, 기름진 음식을 피합니다.\n2. 규칙적으로 식사합니다.\n3. 천천히 잘게 씹어 식사합니다.\n4. 잠자기 2~3시간 전에는 식사를 피합니다.\n5. 식사 후 바로 눕지 않습니다.", "G2": "1. 소염진통제(예: 아스피린 등)를 복용할 경우, 속 쓰림이 심해질 수 있으므로 의료진과 상의합니다.  \n2. 식생활 변화와 함께 적절한 약물을 복용하면 증상 개선에 도움이 될 수 있으므로 의료진과 상담하기 바랍니다. \n   • 제산제, 위 보호제, 위장관 운동 촉진제 등을 복용하면 증상 완화에 도움이 될 수 있습니다.\n3. 자극이 적고 부드럽고 소화가 잘되는 음식을 소량씩 천천히 자주 먹습니다.\n4. 기름진 음식, 튀긴 음식, 짜고 매운 음식, 지나치게 단 음식을 피합니다.", "G3": "1. 속 쓰림이 심하여 환자 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우에는 의료진의 신속한 진료가 필요합니다. \n   • 갑작스러운 심한 통증을 동반한 경우\n   • 구토 시 출혈을 동반하는 경우\n   • 흉통을 동반하는 경우 \n   • 숨쉬기가 곤란한 경우 \n   • 눈 앞이 흐려지면서 실신을 하는 경우\n   • 발열이 있는 경우 \n   • 식사를 전혀 할 수 없는 경우 \n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 있는 경우", "G4": "없음"}, "구토(음식을 토함)": {"G1": "1. 식사 후에는 30분~1시간 정도 앉아서 휴식을 취하고 눕지 않도록 합니다.\n2. 배의 윗부분을 압박하지 않는 헐렁한 옷을 입도록 합니다.\n3. 음식 냄새를 맡으면 증상이 더 심해질 수 있으니 환기를 잘 시키고, 가능한 냄새가 나지 않는 음식으로 먹습니다.\n4. 가스가 차거나 변비가 있으면 메스꺼움이 더 심해질 수 있으므로 해당 증상이 있으면 의료진에게 알립니다.", "G2": "1. 처방받은 약(항구토제)가 있다면 용법에 맞게 규칙적으로 복용합니다.\n2. 음식 냄새를 맡으면 증상이 더 심해질 수 있으니 환기를 잘 시키고, 가능한 냄새가 나지 않는 음식으로 먹습니다.\n3. 식사는 소량씩 천천히 자주 먹고, 다음과 같은 음식을 추천합니다.\n   • 자극이 적고 부드러워서 소화가 잘되는 음식\n   • 차가운 음료나 음식, 얼음 조각, 좋아하는 음료수를 얼려서 먹어 봅니다.\n   • 입안에서 나쁜 맛이 느껴질 때에는 박하사탕 등을 천천히 녹여 먹습니다.\n4. 메스꺼워질 때에는 심호흡을 합니다.\n5. 하루에 2회 이상 양치질(식사를 하지 않아도 입안을 청결히 하는 것이 도움이 됨)을 합니다.\n6. 식사 후에는 30분~1시간 정도 앉아서 휴식을 취하고 눕지 않도록 합니다.", "G3": "1. 구토가 심하여 스스로 일상생활을 하기가 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 지속적인 구토로 인해 경구 섭취가 전혀 불가능한 경우\n   • 갑작스러운 두통이나 어지럼증을 동반한 경우\n   • 심한 복통을 동반한 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 있는 경우\n   • 구토 시 진한 커피색으로 나오거나 피가 섞여 있는 경우", "G4": "없음"}, "복통": {"G1": "복통이 있을 시 아래 방법을 따라 해 봅니다.\n   • 맵거나 자극적인 음식 피하기\n   • 기름기 많은 음식 피하기\n   • 먹고 바로 눕지 않기\n   • 빠르게 많은 양의 음식 섭취 피하기", "G2": "복통이 위장관 증상(속쓰림, 가스 참, 구토, 오심, 설사, 변비 등)과 동반된다면 아래 지침을 실시하면서 증상을 잘 관찰합니다.  \n   • 위에 자극을 줄이기 위해서 음식을 갈아서 소량씩 먹기\n   • 수분 충분히 섭취하기 \n   • 복통에 대해 처방 받았던 약 복용하기\n   • 약은 음식과 함께 혹은 식사 후 복용하기(반드시 공복에 복용해야만 하는 약은 제외)", "G3": "1. 복통(아랫배)이 심해 스스로 일상생활을 하기가 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n   • 진통제를 복용하고 있지만 복통이 7점 이상 지속될 경우\n   • 구토를 하루에 6회 이상하는 경우\n   • 설사를 하루에 7회 이상하는 경우 \n   • 혈변이나 검은변이 나온 경우", "G4": "없음"}, "두통": {"G1": "1. 열감이 있거나 활동을 하기에 상태가 좋지 않다면 타인과 접촉을 피하고 집에서 쉽니다.  \n2. 조용하고 어두운 방안에서 편하게 휴식을 취하거나, 마음이 편안한 음악을 듣습니다.\n3. 긴장을 완화하기 위해 본인에게 맞는 스트레스 해소법을 찾아봅니다.", "G2": "1. 처방받은 진통제를 복용합니다.  \n2. 열감이 있거나 활동을 하기에 상태가 좋지 않다면 타인과 접촉을 피하고 집에서 쉽니다.  \n3. 조용하고 어두운 방안에서 편하게 휴식을 취하거나, 마음이 편안한 음악을 듣습니다.\n4. 긴장을 완화하기 위해 본인에게 맞는 스트레스 해소법을 찾아봅니다.", "G3": "1. 두통이 심해 스스로 일상생활을 하기 어렵다면 의료진의 진료가 필요합니다.\n2. 아래의 경우 의료진의 진료가 필요합니다.  \n   • 진통제를 복용해도 통증이 점점 심해질 때\n   • 구토, 시야흐림, 목이 뻣뻣해지는 증상", "G4": "없음"}, "근육통": {"G1": "1. 휴식, 기분 전환, 이완, 명상, 심호흡 등이 가벼운 통증 완화에 도움이 됩니다.\n2. 매일 아침 일어나자마자 천천히 부드럽게 몸을 스트레칭하는게 도움이 됩니다.\n3. 평소 가벼운 운동을 통해 근력을 유지합니다.\n4. 통증 일기를 작성하여 복용하는 약물과 통증 양상을 기록해 봅니다.\n5. 필요시 소염 진통제 복용으로 통증을 완화할 수 있습니다.", "G2": "1. 처방받은 진통제를 용법대로 규칙적으로 복용합니다.\n2. 하루 4~5회 이상의 돌발성 통증이 발생하는 경우 진통제의 용량을 늘려야 할 수 있으므로 의료진의 진료가 필요합니다.\n3. 진통제를 복용해도 통증이 조절되지 않는 경우 의료진과 상담합니다.\n4. 근육통이나 관절통의 경우 소염진통제 복용으로 통증이 완화될 수 있습니다.\n5. 통증 일기를 작성하여 복용하는 약물과 통증 양상을 기록하여 진료 시 의료진과 상의합니다.", "G3": "1. 근육통이 심해(7점 이상) 환자 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 고열을 동반하는 근육통인 경우 의료진의 신속한 진료가 필요합니다.", "G4": "없음"}, "관절통": {"G1": "1. 휴식, 기분 전환, 이완, 명상, 심호흡 등이 가벼운 통증 완화에 도움이 됩니다.\n2. 매일 아침 일어나자마자 천천히 부드럽게 몸을 스트레칭하는게 도움이 됩니다.\n3. 평소 가벼운 운동을 통해 근력을 유지합니다.\n4. 통증 일기를 작성하여 복용하는 약물과 통증 양상을 기록해 봅니다.\n5. 필요시 소염 진통제 복용으로 통증을 완화할 수 있습니다.", "G2": "1.  항암제 부작용으로 근육통이 발생할 경우 처방받은 진통 소염제를 복용하고 많이 아프면 마약성 진통제를 추가해서 복용합니다.\n2. 암성 통증에 의한 근육통의 경우 처방받은 마약성 진통제를 용법대로 복용하고, 돌발성 통증이 발생하면 빨리 효과가 나타나는 속효성 마약성 진통제를 복용합니다.\n3. 하루 4~5회 이상의 돌발성 통증이 발생하는 경우 진통제의 용량을 늘려야 할 수 있으므로 의료진의 진료가 필요합니다.\n4. 진통제를 복용해도 통증이 조절되지 않는 경우 의료진과 상담합니다.\n5. 통증 일기를 작성하여 복용하는 약물과 통증 양상을 기록하여 병원 방문 시 의료진과 상의합니다.", "G3": "1. 관절통이 심해(7점 이상) 환자 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우에는 의료진의 신속한 진료가 필요합니다.  \n   • 관절의 붓기, 통증과 고열을 동반한 경우 \n   • 골절이 의심되는 경우", "G4": "없음"}, "통증": {"G1": "1. 휴식, 산책, 기분 전환, 이완, 명상, 요가, 심호흡 등이 가벼운 통증 완화에 도움이 됩니다.\n2. 필요 시 진통제 복용으로 통증을 완화할 수 있습니다.\n3. 통증 일기를 작성하여 복용하는 약물과 통증 양상을 기록해 보세요.", "G2": "1. 항암제 부작용으로 통증이 발생할 경우 처방받은 진통제를 복용하고 많이 아프면 마약성 진통제를 추가해서 복용합니다.\n2. 암성 통증의 경우 처방받은 마약성 진통제를 용법대로 복용하고, 돌발성 통증이 발생하면 속효성 마약성 진통제를 복용합니다.\n3. 하루 4~5회 이상의 돌발성 통증이 발생하는 경우 진통제의 용량을 늘려야 할 수 있으므로 의료진의 진료가 필요합니다.\n4. 진통제를 복용하고 있는 데도 통증이 조절되지 않는 경우 의료진과 상담합니다.\n5. 통증 일기를 작성하여 복용 중인 약물과 통증의 양상을 기록해 두면, 병원 방문 시 의료진과 보다 효과적으로 상의할 수 있습니다.", "G3": "1. 통증이 심하며(7점 이상), 스스로 일상생활을 하기가 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우가 동반되면 의료진의 신속한 진료가 필요합니다.\n   • 고열을 동반한 국소 통증인 경우", "G4": "없음"}, "어지러움": {"G1": "1. 일어서거나 걷다가 순간적인 어지러움으로 넘어질 수 있으니 미끄럽지 않은 신발을 신고 조심히 걸으세요.  \n2. 어지러움이 반복되면 운전은 하지 않는 것이 좋습니다.\n3. 어지러움을 일으킬 만한 약제를 복용하고 있는지 의료진에게 확인합니다.\n4. 어지러움의 양상이 어떤지 관찰하여 의료진에게 알립니다.\n   • 회전성(내 몸이나 주변이 도는 느낌)인지\n   • 기립성(일어나면 어지러움)인지\n   • 어지러움과 함께 느껴지는 증상은 무엇인지", "G2": "1. 원인에 따라 물리치료, 운동치료, 약물치료 등 다양한 치료가 있으므로 의료진에게 물어보세요.\n2. 일어서거나 걷다가 순간적인 어지러움으로 넘어질 수 있으니 미끄럽지 않은 신발을 신고 조심히 걷도록 합니다.\n3. 어지러움이 반복되면 운전은 하지 않는 것이 좋습니다.\n4. 어지러움을 일으킬 만한 약제를 복용하고 있는지 의료진에게 확인합니다.\n5. 어지러움의 양상이 어떤지 관찰하여 의료진에게 알립니다.\n   • 회전성(내 몸이나 주변이 도는 느낌)인지 \n   • 기립성(일어나면 어지러움)인지\n   • 어지러움과 같이 느껴지는 증상은 무엇인지", "G3": "1. 어지러움이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래 증상이 동반된다면 의료진의 신속한 진료가 필요합니다.\n  • 팔/다리에 힘이 없거나 움직일 수 없을 때 \n  • 심한 두통 \n  • 안면(얼굴) 마비가 있을 때 \n  • 말이 어눌해졌을 때 \n  • 심한 어지러움으로 구역/구토가 동반됨 \n  • 심한 어지러움으로 혼자 서 있거나 걷기가 어려울 때 \n  • 흑색변, 혈뇨 등의 출혈\n  • 창백함, 식은땀, 가늘고 약한 맥박, 시야 장애 발생, 의식 소실 등", "G4": "없음"}, "입술 가장자리가 트거나 갈라짐": {"G1": "1. 증상이 점점 심해지지 않는지 매일 관찰합니다.\n2. 입술에 침을 바르지 않도록 합니다.\n3. 입술이 건조해지지 않도록 자극이 없는 립밤을 사용합니다.\n4. 건조함을 방지하기 위해 충분한 수분 섭취를 권장합니다.\n5. 입술을 자극할 수 있는 매운 음식, 신맛이 강한 음식, 뜨거운 음식을 피합니다.\n6. 이차 감염을 예방하기 위해 입안을 청결하게 유지합니다.", "G2": "1. 통증이 있을 경우 약한 진통제를 사용합니다.\n2. 증상이 심해질 경우 의료진의 진료를 권고합니다.\n3. 아래 사항을 실천해 봅니다. \n   • 증상이 점점 심해지지 않는지 매일 관찰합니다.\n   • 입술에 침을 바르지 않도록 합니다.\n   • 입술이 건조해지지 않도록 자극이 없는 립밤을 사용합니다. \n   • 건조함을 방지하기 위해 충분한 수분 섭취를 권장합니다.\n   • 입술을 자극할 수 있는 매운 음식, 신맛이 강한 음식, 뜨거운 음식을 피합니다.\n   • 이차 감염을 예방하기 위해 입안을 청결하게 유지합니다.", "G3": "증상이 심하여 스스로 일상생활이 어려운 경우 의료진의 진료가 필요합니다.", "G4": "없음"}, "소화 불량": {"G1": "1. 과식, 술, 담배, 커피, 매운 음식, 기름진 음식을 피하세요.\n2. 규칙적으로 식사하세요.\n3. 천천히 꼭꼭 씹어 드시면 소화에 도움이 됩니다.\n4. 잠들기 2~3시간 전에는 식사를 피하세요.\n5. 식사 후 바로 눕지 않습니다.", "G2": "1. 소염 진통제(예: 아스피린 등)를 복용할 경우, 소화불량이 심해질 수 있으므로 의료진과 상의합니다.\n2. 식생활 변화와 함께 적절한 약물을 복용하면 증상 개선에 도움이 될 수 있으므로 의료진과 상담하세요.\n   • 제산제, 위 보호제, 위장관 운동 촉진제 등을 복용하면 증상에 도움이 될 수 있습니다.\n3. 자극이 적고 부드럽고 소화가 잘되는 음식을 소량씩 천천히 자주 먹습니다.\n4. 기름진 음식, 튀긴 음식, 짜고 매운 음식, 지나치게 단 음식, 카페인, 우유 등의 유제품을 피합니다.", "G3": "1. 소화불량이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우가 동반되면 의료진의 신속한 진료가 필요합니다.\n   • 갑작스러운 심한 통증을 동반한 경우\n   • 구토 시 출혈을 동반하는 경우\n   • 흉통을 동반하는 경우\n   • 숨 쉬기가 곤란한 경우\n   • 눈앞이 흐려지면서 실신하는 경우\n   • 발열이 있는 경우\n   • 식사를 전혀 할 수 없는 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 있는 경우", "G4": "없음"}, "복부 팽만(가스가 찬 것처럼 배가 빵빵해짐)": {"G1": "1. 소화가 잘 되는 음식 위주로 규칙적으로 소량씩 자주 식사합니다.\n2. 수분 섭취를 충분히 하고, 배변을 규칙적으로 하는 게 도움이 됩니다.\n3. 가벼운 운동과 신체 활동은 소화불량 및 복부팽만감 완화에 도움이 됩니다.\n4. 따뜻한 물주머니를 배에 대어 장 운동을 촉진시켜 봅니다.", "G2": "1. 속 쓰림, 변비, 복통, 설사가 같이 동반되는 경우 증상에 맞는 약을 복용하면 도움이 될 수 있습니다.\n2. 복부 팽만감(혹은 가스가 차는 증상)이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n3. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 24시간 이상 가스배출 및 배변이 전혀 없으면서 복부 팽만이 더욱 심해지는 경우\n   • 발열과 심한 복통이 같이 있는 경우\n   • 구토가 심하여 식사를 전혀 못하는 경우", "G3": "없음", "G4": "없음"}, "식욕감소": {"G1": "1. 식욕이 없으면 밥 대신 죽 또는 부드러운 음식, 주스 같은 음식으로 바꿔서 먹어 봅니다.\n2. 음식을 조리하는 냄새가 싫을 때에는 조리 장소를 피합니다.\n3. 식전에 가벼운 운동을 하는 등 활동량을 늘리는 게 도움이 됩니다. \n4. 신맛은 입맛을 자극하기 때문에 구강 염증이 없다면 레모네이드나 오렌지주스 등 새콤한 맛이 나는 과일주스가 도움이 될 수 있습니다.", "G2": "1. 먹기 쉽고 열량이 높은 음식을 먹어봅니다.\n   • 죽, 부드러운 음식, 아이스크림, 우유, 요거트 같은 유제품, 계란찜, 치즈, 콩, 달걀, 고기, 견과류  등\n2. 미리 하루의 식단을 계획하고 시간에 맞추어 규칙적으로 식사합니다.\n3. 식사 30분 전에는 되도록 물을 마시지 않습니다.\n4. 보통 아침에 식욕이 좋은 경우가 많으므로 아침 식사를 꼭 합니다.\n   • 하루에 필요한 단백질과 열량의 1/3을 아침 식사로 섭취해 보세요.\n5. 하루에 5~6끼로 나누어 작은 접시에 담아 먹어 봅니다.\n6. 양배추나 탄산음료(사이다, 콜라 등)는 가스로 인한 복부팽만을 유발하므로 가급적 피합니다.\n7. 식사량이 많이 부족한 경우는 마시는 형태의 경구영양보충제를 먹어보거나, 의료진과 상의하여 식욕촉진제를 복용해볼 수 있습니다.\n8. 통증 때문에 식욕이 없다면 식사 전에 처방 받은 진통제를 먼저 복용하도록 합니다.", "G3": "1. 식욕 감소가 심하며 스스로 일상생활을 하기가 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우 의료진의 진료가 필요합니다. \n   • 5% 이상의 체중이 빠진 경우 \n   • 항암제의 부작용(메스꺼움, 구토, 설사 등)이  2주 이상 지속되어서 식욕이 돌아오지 않는 경우  \n3. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n   • 음식을 전혀 못 먹으면서 발열 혹은 의식저하가 동반된 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 있는 경우", "G4": "없음"}, "소변색의 변화": {"G1": "1. 소변 색이 진한 경우 수분 섭취를 늘리고 소변을 자주 보는 게 도움이 될 수 있습니다.\n2. 일부 항암제의 색깔로 인하여 붉은색 소변을 볼 수 있으나 1~2일 지나면 정상으로 돌아옵니다. \n   예) 독소루비신(아드리아마이신)\n3. 아래 증상이 동반되는 경우 의료진의 진료가 필요합니다.  \n   • 탈수 증상(소변량 감소, 기력 저하)이 있는 경우 \n   • 소변 색이 눈에 띄게 점점 붉어지거나 진해지는 경우", "G2": "없음", "G3": "없음", "G4": "없음"}, "변을 참기 어려움": {"G1": "1. 아래 사항에 대해 매일 관찰하고 기록합니다.\n   • 배변 횟수와 시간\n   • 변실금의 횟수와 시간\n   • 대변의 굳기\n   • 대변을 못 참는 횟수와 시간\n   • 패드 사용 횟수\n   • 관련 약물 복용 여부\n2. 변실금으로 인해 항문 주위의 피부가 헐 수 있으므로 배변 후 항문 주변을 따뜻한 물로 씻은 후 충분히 말립니다.\n3. 가스가 차거나 장을 자극해 설사와 변실금을 유발하는 음식은 피합니다.\n4. 인지장애가 있는 경우 정해진 시간에 매일 배변 연습을 합니다.", "G2": "1. 대변 완하제(변비약) 등의 약제를 피합니다.\n2. 가스가 차거나 장을 자극해 설사와 변실금을 유발하는 음식은 피합니다.\n3. 아래 사항에 대해 매일 관찰하고 기록합니다.\n   • 배변 횟수와 시간\n   • 변실금의 횟수와 시간\n   • 대변의 굳기\n   • 대변을 못 참는 횟수와 시간\n   • 패드 사용 횟수\n   • 관련 약물 복용 여부\n4. 변실금으로 인해 항문 주위의 피부가 헐 수 있으므로 배변 후 항문 주변을 따뜻한 물로 씻은 후  충분히 말립니다.\n5. 인지장애가 있는 경우 정해진 시간에 매일 배변 연습을 합니다.", "G3": "아래의 증상이 동반된 경우 의료진의 진료가 필요합니다.\n   • 복부 팽만과 심한 복통이 동반되는 경우 \n   • 혈변이나 검은 변이 동반되는 경우", "G4": "없음"}, "눈 앞이 번쩍거림": {"G1": "1. 인공 눈물을 사용하며 경과를 지켜봅니다.\n2. 충분한 수분 섭취를 합니다.\n3. 증상이 계속될 경우 1주일 이내로 안과를 방문합니다.", "G2": "1. 증상이 지속될 시 병원을 방문하여 의료진과의 상담이 필요합니다.\n2. 증상을 유발할 만한 약제를 복용하고 있는지 의료진과 확인하고, 안과 진료 전까지 관련 약제 복용을 하지 않습니다.\n3. 가능한 빨리 안과를 방문합니다.", "G3": "1. 아래 증상이 있는 경우 의료진의 진료가 필요합니다. \n   • 시력이 매우 떨어짐 \n   • 눈물이 지속적으로 나며 앞을 보기 어려움 \n   • 시야 결손 \n   • 지속적으로 이물감이 느껴짐 \n   • 통증 및 발적을 동반한 안검 부종\n   • 한 눈 또는 두 눈의 안구 돌출\n   • 눈을 움직일 때 동반되는 통증\n   • 두 개로 보임(복시)\n   • 색각 저하   \n2. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n   • 한 눈 또는 두 눈의 갑작스러운 실명 \n   • 갑자기 심한 안구 통증 발생", "G4": "없음"}, "눈 앞에 점이나 선(부유물)이 떠다님": {"G1": "1. 인공 눈물을 사용하며 경과를 지켜봅니다.\n2. 충분한 수분 섭취를 합니다.\n3. 항암치료 이후에 새롭게 생긴 증상이 지속되거나 심해질 경우 1주일 이내로 안과를 방문합니다.\n4. 눈 앞 부유물이 증가되지 않는 경우라면 노화의 과정으로 인한 것일 수 있고, 시간이 지나면서 적응되면 잘 느껴지지 않을 수도 있습니다.", "G2": "1. 항암치료 이후에 새롭게 생긴 증상이 지속되면 의료진과의 상담이 필요합니다.  \n2. 가능한 빨리 안과를 방문합니다.\n3. 증상을 유발할 만한 약제를 복용하고 있는지 의료진과 확인하고, 안과 진료 전까지 관련 약제 복용을 하지 않습니다.\n4. 눈 앞 부유물이 증가되지 않는 경우라면 노화의 과정으로 인한 것일 수 있고, 시간이 지나면서 적응되면 잘 느껴지지 않을 수도 있습니다.", "G3": "1. 아래 증상이 있는 경우 의료진의 진료가 필요합니다. \n   • 시력이 갑작스럽게 매우 떨어짐\n   • 눈물이 지속적으로 나며 앞을 보기 어려움 \n   • 시야의 일부를 가리는 커튼 같은 부분 또는 흐릿한 영역이 발생함 \n   • 시야 한쪽이 어두워지고, 주변 시력이 상실됨 \n   • 눈 부유물이 있는 눈에서 빛이 번쩍이는 게 느껴짐 \n   • 눈 부유물이 갑자기 증가하는 경우\n   • 지속적으로 이물감이 느껴짐 \n   • 통증 및 발적을 동반한 안검 부종 \n   • 한 눈 또는 두 눈의 안구 돌출 \n   • 눈을 움직일 때 동반되는 통증 \n   • 두 개로 보임(복시) \n   • 색각 저하\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n   • 한 눈 또는 두 눈의 갑작스러운 실명 \n   • 시야의 일부를 가리는 회색 커튼 같은 부분, 또는 흐릿한 영역 발생 \n   • 시야 한쪽이 어두워지고 주변 시력 상실\n   • 갑자기 심한 안구 통증 발생", "G4": "없음"}, "귀에서 소리가 남(이명)": {"G1": "1. 이명은 전체 인구의 약 20%가 경험하는 흔한 증상으로 난청이나 어지러움이 동반되지 않는다면 많이 걱정하지 않아도 됩니다.\n2. 이명을 신경쓰면 더 크게 들리고, 계속 생각하게 될 수 있으므로 되도록 무시하고 지내다 보면 인식하지 않게 될 수도 있습니다.\n3. 소음이 많은 곳을 피하고, 귀마개를 착용해서 귀를 보호합니다.\n4. 헤드폰, 이어폰의 소리 크기를 평소보다 줄여 봅니다.", "G2": "1. 이명은 조용한 환경에서 심해지는 경향이 있으므로 방해되지 않는 조용한 소리를 만들어 주는 것이 좋습니다. \n   • 클래식 음악이 나오는 라디오, 스마트폰을 이용한 백색 소음 등을 배경처럼 깔아두면 이명의 인지를 줄이는 데 도움이 됩니다.\n2. 본인이 인지하지 못하는 난청이 이명의 원인이 될 수도 있으므로 최근에 청력검사를 받은 적이 없다면 이비인후과에서 청력검사를 해보도록 합니다.\n3. 아래 증상이 있다면 의료진의 진료가 필요합니다. \n   • 이명 때문에 수면에 방해를 받는 경우(이로 인해 이명이 더 악화될 수 있으므로 약물치료가 도움이 될 수 있습니다.) \n   • 이명 때문에 다른 일에 집중할 수 없을 때 \n   • 이명이 생기면서 소리가 잘 안 들릴 때 \n   • 이명 때문에 부정적인 생각과 걱정이 많아질 때 \n   • 갑자기 귀에 물이 들어간 듯 먹먹할 때", "G3": "1.  아래 증상이 있다면 의료진의 진료가 필요합니다. \n   • 이명 때문에 수면에 방해를 받는 경우(이로 인해 이명이 더 악화될 수 있으므로 약물치료가 도움이 될 수 있습니다.) \n   • 이명 때문에 다른 일에 집중할 수 없을 때 \n   • 이명이 생기면서 소리가 잘 안 들릴 때\n   • 이명 때문에 부정적인 생각과 걱정이 많아질 때 \n   • 갑자기 귀에 물이 들어간 듯 먹먹할 때\n2. 아래 증상이 동반되면 의료진의 신속한 진료가 필요합니다. \n   • 갑자기 한쪽 또는 양쪽 청력이 완전히 소실되었을 때 \n   • 갑자기 귀에 심한 통증이 발생했을 때 \n   • 어지러움과 현기증을 동반한 이명 증상으로 일상생활이 불가능할 때 \n   • 귀가 먹먹한 느낌 \n   • 갑작스러운 어지러움", "G4": "없음"}, "예상치 못하게, 과도하게 밤낮 관계없이 땀이 남": {"G1": "1. 주기적으로 체온을 재고, 체온이 정상이라면 땀이 많이 나는 증상은 크게 걱정하지 않아도 됩니다. \n2. 폐경기 증상이 아닌지 확인해 봅니다.\n3. 당뇨가 있는 경우 저혈당의 가능성이 있으니, 혈당 측정을 권유합니다.\n4. 스트레스를 피합니다.\n5. 매운 음식이나 고카페인 음료, 알코올 섭취를 피하세요.\n6. 가능하면 생활 환경의 습도를 낮추고, 실내 온도는 너무 높게 유지하지 않습니다.\n7. 통풍이 잘되고 얇은 옷을 입으세요.\n8. 복용하는 약제들 중 콜린 약제(pilocapine), 우울증 약제, 베타 차단제 같은 땀을 유발하는 약물을 복용하고 있는지 확인해 보세요.", "G2": "1. 주기적으로 체온을 재고, 체온이 정상이라면 땀이 많이 나는 증상은 크게 걱정하지 않아도 됩니다. \n2. 폐경기 증상이 아닌지 확인해 봅니다.\n3. 당뇨가 있는 경우 저혈당의 가능성이 있으니, 혈당 측정을 권유합니다.\n4. 땀 냄새가 심한 경우, 샤워를 자주 하고 경우에 따라 데오드란트(땀 냄새 제거제)를 사용합니다. \n5. 검사를 위해 의료진의 진료가 필요할 수 있습니다. \n   • 갑상선 기능 검사, 혈당 검사 등 \n6. 스트레스를 피합니다.\n7. 매운 음식이나 고카페인 음료, 알코올 섭취를 피하세요.\n8. 가능하면 생활 환경의 습도를 낮추고, 실내 온도는 너무 높게 유지하지 않습니다.\n9. 통풍이 잘되고, 얇은 옷을 입으세요.\n10. 복용하는 약제들 중 콜린 약제(pilocapine), 우울증 약제, 베타 차단제 같은 땀을 유발하는 약물을 복용하고 있는지 확인해 보세요.", "G3": "1. 아래의 경우 의료진의 진료가 필요합니다. \n  • 1시간 이상 38도 이상인 경우 \n  • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 심하고 음식이나 수분 섭취가 어려운 경우\n  • 발열이 있으면서 발한이 심한 경우\n  • 땀으로 인한 피부색 변화, 갈라짐, 피부 감염, 습진이 있는 경우\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n  • 쇼크(저혈압, 저혈당 등) 증상이 있는 경우(어지러움, 호흡 수, 맥박 수 증가, 의식 저하, 혈당 저하 등)", "G4": "없음"}, "예상치 못하게 땀이 덜 나는 것": {"G1": "1. 주기적으로 체온을 측정하고 정상이라면, 땀이 적게 나는 증상은 크게 걱정하지 않으셔도 됩니다. \n2. 현재 사용 중인 약물 중 증상을 유발할 수 있는 약제에 관해 의료진과 상의합니다. \n3. 주변 환경을 시원하게 유지합니다. \n4. 피부의 각질이 심한 경우, 땀샘을 막을 수 있으니 제거합니다.", "G2": "1. 주기적으로 체온을 측정하고 정상이라면, 땀이 적게 나는 증상은 크게 걱정하지 않으셔도 됩니다. \n2. 현재 사용 중인 약물 중 증상을 유발할 수 있는 약제에 관해 의료진과 상의합니다. \n3. 주변 환경을 시원하게 유지합니다. \n4. 피부의 각질이 심한 경우, 땀샘을 막을 수 있으니 제거합니다.\n5. 통풍이 잘되고 얇은 옷차림을 유지합니다.", "G3": "1. 아래의 경우 의료진의 진료가 필요합니다.\n   • 1시간 이상 38도 이상인 경우\n   • 체온이 지속적으로 올라가는 경우\n   • 열사병(의식 저하 및 무기력) 증상이 있는 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 심하고 음식이나 수분 섭취가 어려운 경우\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 1시간 이상 고열(38도 이상)의 경우\n   • 쇼크(저혈압, 저혈당 등) 증상이 있는 경우(어지러움, 호흡 수, 맥박 수 증가, 의식 저하, 혈당 감소 등)\n   • 마비 증상을 동반한 땀 분비 감소", "G4": "1. 아래의 경우 의료진의 진료가 필요합니다.\n   • 1시간 이상 38도 이상인 경우\n   • 체온이 지속적으로 올라가는 경우\n   • 열사병(의식 저하 및 무기력) 증상이 있는 경우\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등) 이 심하고 음식이나 수분 섭취가 어려운 경우\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 1시간 이상 고열(38도 이상)의 경우\n   • 쇼크(저혈압, 저혈당 등) 증상이 있는 경우(어지러움, 호흡 수, 맥박 수 증가, 의식 저하, 혈당 감소 등)\n   • 마비 증상을 동반한 땀 분비 감소"}, "피부 가려움": {"G1": "1. 순한 비누와 미지근한 물(혹은 시원한 물)을 사용하여 목욕하고, 수건으로 가볍게 두드려서 말립니다.\n2. 뜨거운 물에 거품 목욕을 하는 것은 피합니다.\n3. 피부를 촉촉하게 유지하기 위해 알코올이 없는 로션, 크림, 오일 등을 자주 발라 주세요.\n4. 가려운 곳을 마사지하거나 얼음팩을 수건에 싸서 올려 보세요.\n5. 향수, 화학 성분이 포함된 화장품 등 알레르기 반응을 일으킬 수 있는 것들을 피해 보세요.\n6. 피부를 자주 긁거나 문지르지 않도록 합니다.\n7. 너무 뜨겁거나, 너무 차가운 바람은 피하도록 합니다.", "G2": "증상 완화를 위해 필요할 경우 항히스타민제 및 국소 스테로이드 로션 등을 처방받을 수 있습니다.", "G3": "1. 피부 가려움이 심하여 스스로 일상생활이 어려운 정도인 경우 의료진의 진료가 필요합니다.\n2. 광범위하고 지속적인 가려움이 호전되지 않으면, 스테로이드 등의 약제가 도움이 될 수도 있습니다.  \n3. 아래 증상이 동반된 경우 의료진의 신속한 진료가 필요합니다. \n   • 호흡곤란, 얼굴이나 목이 붓는 느낌   \n   • 쌕쌕거리는 숨소리, 전신의 두드러기가 동반되는 경우", "G4": "없음"}, "변비": {"G1": "1. 식사 후 규칙적으로 배변을 시도해 보는 것이 도움이 됩니다.\n2. 대변을 보고 싶을 때 참지 않도록 하고, 배변 시 편안하고 사생활이 보장되는 환경이 중요합니다.\n3. 섬유질이 많은 음식(예: 야채, 현미, 견과류 등)과 하루 8~10잔의 수분을 섭취합니다.\n4. 가능한 한 일상활동이나 운동(걷기, 자전거 등)을 평상시대로 합니다.\n5. 변비약(변완하제) 처방을 받았다면 용법대로 복용합니다.", "G2": "1. 생활 습관 개선이나 식이 섬유 섭취, 변비약(변완하제) 복용 후에도 2일 이상 변비가 지속되는 경우 의료진과 상담 후 변완하제를 추가하거나 관장, 좌약을 고려합니다.\n2. 항암치료 후 호중구 수치가 많이 감소되는 시기에는(보통 항암제 투여 후 1~2주 사이) 좌약이나 관장을 피하도록 합니다.", "G3": "1. 변비가 심하여 스스로 일상생활을 하기가 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우가 동반되면 의료진의 신속한 진료가 필요합니다.\n   • 복통이나 복부 팽만이 동반되어서 경구 섭취가 불가능한 경우\n   • 다량의 출혈이 항문에서 나온 경우", "G4": "없음"}, "무른 변(설사)": {"G1": "1. 설사할 때 피하면 좋을 음식은 다음과 같습니다.\n   • 장을 자극하거나 가스가 생기는 콩, 생야채, 생과일, 옥수수, 양배추, 탄산음료, 거친 섬유질이 많은 채소\n   • 강한 양념, 카페인 음료, 강한 신맛, 매운 음식, 기름진 음식, 딱딱한 음식, 우유와 유제품 등\n2. 설사가 심하면 몸의 수분이 부족해지므로 충분한 수분을 섭취합니다.\n3. 설사로 항문 주위의 피부가 허는 경우가 많으므로 배변 후 항문 주변을 따뜻한 물로 씻은 후 완전히 말립니다.\n4. 설사로 항문에 상처가 생기면 감염의 가능성이 있고, 통증과 염증이 생길 수 있으므로 상처를 진정시키는 크림이나 연고를 바릅니다.\n5. 치질이 있다면 좌욕이 도움이 됩니다.", "G2": "1. 설사약(지사제)를 처방받은 적이 없다면 의료진의 진료가 필요합니다.\n2. 병원에서 처방받은 설사약을 복용하고 있는 중인데도 설사가 지속될 경우, 의료진의 진료가 필요합니다.\n3. 경구 항암제를 복용하고 있는 경우에는 항암제 중단 여부는 반드시 의료진과 상의해야 합니다.\n4. 설사약 복용 후 12시간 이상 설사가 없다면 설사약 복용을 중단하고 고형식(예: 밥 등)을 소량씩 서서히 먹어 봅니다.", "G3": "1. 설사가 심하여 스스로 일상생활을 하기가 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우가 동반되면 의료진의 신속한 진료가 필요합니다.\n   • 혈변\n   • 음식 섭취를 못해서 탈수 증상(기력이 급격히 떨어짐, 소변량 감소)이 동반된 경우\n   • 발열 또는 심한 복통을 동반한 경우", "G4": "없음"}, "목소리 변화": {"G1": "1. 위산이나 음식물이 역류하면, 목소리 변화를 일으킬 수 있으므로 불편하다면 진료를 받으세요.\n2. 목소리가 약간 변한 정도는 많이 걱정하지 않아도 됩니다.\n3. 목소리를 내는 것을 가능한 한 줄이고, 특히 큰 목소리를 내지 않도록 유의합니다.\n4. 충분한 수분 섭취가 중요합니다.\n5. 금연해야 합니다.", "G2": "1. 지속적인 목소리 변화는 성대 이상이 원인일 수도 있으므로 담당 의료진과 상의 후 이비인후과에서 검사를 받는 것이 좋습니다.\n2. 성대는 점막으로 되어있어 일부 항암치료의 부작용으로 점막이 건조해지고 목소리가 변하는 경우가 있습니다.\n3. 목소리를 내는 것을 가능한 한 줄이고, 특히 큰 목소리를 내지 않도록 유의합니다.\n4. 충분한 수분을 섭취하고, 과도한 히터나 에어컨 사용과 같은 건조한 환경을 피하고 가습기를 사용합니다.", "G3": "1. 목소리 변화가 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우 의료진의 진료가 필요합니다.\n   • 목소리 변화가 심해서 남이 내 말을 알아듣기 어렵다면, 성대 마비 등의 가능성이 있으므로 검사가 필요합니다.\n   • 지속적인 목소리 변화는 성대 이상이 원인일 수도 있으므로 이비인후과에서 검사를 받는 것이 좋습니다.\n   • 양쪽 성대 마비의 경우 호흡곤란 등 응급상황이 발생할 수 있으므로 미리 성대 상태를 확인하고 주의 사항을 숙지합니다.\n3. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 양쪽 성대 마비 등 호흡곤란이 동반되는 경우\n   • 기침, 얼굴과 팔의 부기, 38도 이상의 고열이 동반되는 경우", "G4": "없음"}, "쉰 목소리": {"G1": "1. 위산이나 음식물이 역류하면, 목소리 변화를 일으킬 수 있으므로 불편하다면 진료를 받으세요.\n2. 약간 혹은 가끔씩 목소리가 쉬는 정도는 일반적으로 큰 지장이 없으므로 걱정하지 않아도 됩니다.\n3. 목소리를 내는 것을 가능한 한 줄이고, 특히 큰 목소리를 내지 않도록 유의합니다.\n4. 충분한 수분 섭취가 중요합니다.\n5. 금연해야 합니다.", "G2": "1. 지속적인 목소리 변화는 성대 이상이 원인일 수도 있으므로 주치의와 상의 후 이비인후과에서 검사를 받는 것이 좋습니다.\n2. 성대는 점막으로 되어있어 일부 항암치료의 부작용으로 점막이 건조해지고 쉰 목소리가 나는 경우가 있습니다.\n3. 과도한 히터나 에어컨 사용과 같은 건조한 환경을 피하고, 가습기를 사용합니다.", "G3": "1. 쉰 목소리가 심하여 스스로 일상생활을 하기가 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우 의료진의 진료가 필요합니다.\n   • 쉰 목소리가 심하게 지속되는 경우 성대 마비 등의 가능성이 있어 검사가 필요합니다.\n   • 지속적인 목소리 변화는 성대 이상이 원인일 수도 있으므로 이비인후과에서 검사를 받는 것이 좋습니다.\n   • 양쪽 성대 마비의 경우 호흡곤란 등 응급상황이 발생할 수 있으므로 미리 성대 상태를 확인하고 주의 사항을 숙지합니다.\n3. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 양쪽 성대 마비 등 호흡곤란이 동반되는 경우\n   • 기침, 얼굴과 팔의 부기, 38도 이상의 고열이 동반되는 경우", "G4": "없음"}, "얼굴 화끈거림": {"G1": "1. 얼굴 화끈거림 때문에 일상생활이 너무 힘들다면 일시적 완화를 위한 약물 치료를 해볼 수 있으니 진료 시 주치의와 상의하세요.\n2. 규칙적인 운동과 체온 조절이 필요합니다.\n3. 명상이나 요가 등으로 스트레스를 줄이는 게 도움이 됩니다.\n4. 덥고 습한 환경, 밀폐된 환경을 피합니다. \n   • 뜨겁거나 매운 음식, 헤어드라이어 사용 등을 피합니다. \n   • 얇은 옷을 여러 겹으로 착용하여 더우면 쉽게 벗을 수 있게 합니다.\n   • 조이지 않는 면 소재 또는 자연 섬유 재질의 옷을 입어 봅니다.\n5. 시원한 환경을 만들어 보세요.\n   • 시원한 물을 마시고, 필요 시 아이스팩을 사용해 보세요. \n   • 선풍기를 이용하거나, 창문을 열어 공기를 순환시키면서 실내 온도를 시원하게 만들어 보세요.", "G2": "1. 얼굴 화끈거림 때문에 일상생활이 너무 힘들다면 일시적 완화를 위한 약물 치료를 해볼 수 있으니 진료 시 주치의와 상의하세요.\n2. 규칙적인 운동과 체온 조절이 필요합니다.\n3. 명상이나 요가 등으로 스트레스를 줄이는 게 도움이 됩니다.\n4. 덥고 습한 환경, 밀폐된 환경을 피합니다. \n   • 뜨겁거나 매운 음식, 헤어드라이어 사용 등을 피합니다. \n   • 얇은 옷을 여러 겹으로 착용하여 더우면 쉽게 벗을 수 있게 합니다.\n   • 조이지 않는 면 소재 또는 자연섬유 재질의 옷을 입어 봅니다.\n5. 시원한 환경을 만들어 보세요.\n   • 시원한 물을 마시고, 필요 시 아이스 팩을 사용해 보세요. \n   • 선풍기를 이용하거나, 창문을 열어 공기를 순환시키면서 실내 온도를 시원하게 만들어 보세요..", "G3": "얼굴 화끈거림이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.", "G4": "없음"}, "피로, 피곤함 또는 기운 없음": {"G1": "1. 일상생활에 무리가 가지 않게 신체 활동을 유지하는 것이 피로 완화에 도움이 됩니다.\n2. 평상시의 생활을 유지하되, 피로를 느낀다면 바로 휴식을 취합니다.\n3. 가벼운 산책 등의 육체적 활동은 입맛도 좋게 하므로 도움이 됩니다.\n4. 충분한 수분, 열량, 단백질, 탄수화물, 지방, 비타민 및 미네랄 등을 포함하는 균형 잡힌 식사를 합니다.\n5. 매일 규칙적으로 비슷한 시간에 자고 일어나는 것이 좋습니다.", "G2": "피로를 줄이기 위하여 일상생활을 조정하고 에너지를 아끼기 위하여 아래 사항을 참고합니다.\n   • 암 환자의 피로는 오후 시간에 심해지는 경향이 있으니 많은 에너지가 필요한 일은 오전에 합니다. \n   • 해야 할 일들을 미리 계획하여 우선순위를 정해 본 후 덜 중요한 일은 줄이거나 없앱니다. \n   • 활동과 휴식을 자주 반복하도록 합니다. \n   • 서서 하는 활동을 한다면 수시로 자주 앉도록 합니다.\n   • 식사 준비를 보호자나 가족에게 부탁하거나, 이미 만들어진 음식을 주문해 봅니다.", "G3": "1. 피로/피곤함이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우는 의료진의 신속한 진료가 필요합니다.  \n   • 의식 수준의 저하가 있는 경우\n   • 38도 이상의 열이 발생하는 경우", "G4": "없음"}, "손이나 발에 발진이 생겨 갈라지거나 벗겨짐, 빨개지고 통증이 있음(수족증후군)": {"G1": "1. 치료 첫 2~4주 동안에는 손발에 압력이나 마찰이 많은 활동을 피하는 게 좋습니다.\n2. 건조한 부위에는 알코올 성분이 없는 보습제를 자주 바르고 흡수를 위해 면장갑이나 발에 잘 맞고 땀 흡수가 잘 되는 면양말을 착용합니다.\n3. 뜨거운 물에 닿는 것을 피합니다.\n4. 설거지, 빨래 등 물을 오래 사용하는 일을 할 때 고무장갑을 꼭 착용합니다.\n5. 꽉 끼는 신발을 신지 말고 발에 여유 있게 잘 맞는 신발을 신습니다. \n   * 샌들, 슬리퍼, 하이힐 등은 신지 않습니다.\n6. 굳은 살 부위에는 각질 용해제를 바르거나 신발에 닿는 굳은 살 부위에는 쿠션젤을 사용해 봅니다.", "G2": "1. 증상 정도에 따라 진통제, 스테로이드, 항생제, 각질용해제를 처방받을 수 있습니다.\n2. 출혈, 진물이 생긴 부위에는 국소 항생제 연고의 처방이 필요할 수 있습니다.\n3. 피부 보습을 위해 보습제를 충분히 바릅니다.", "G3": "1. 수족증후군 증상이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 통증을 동반한 심한 피부 변화가 생긴 경우, 의료진의 진료가 필요합니다.\n3. 아래의 증상을 동반한 경우, 의료진의 신속한 진료가 필요합니다. \n   • 38도 이상의 고열을 동반하는 상처 감염 \n   • 매우 심한 통증으로 스스로 돌보기 어려운 정도", "G4": "없음"}, "항암주사 맞은 부위 통증, 부기, 빨개짐": {"G1": "1. 주사 부위의 불편감, 약제가 새는 느낌, 통증, 화끈거림 등이 있다면 의료진에게 반드시 알립니다.\n2. 혈관이 좋지 않거나 반복적으로 혈관 주사를 맞아야 하는 경우에는 중심정맥관 시술을 권고합니다.\n3. 혈관 주사를 맞을 때, 유방절제술을 한 쪽의 팔은 피하는 게 좋습니다.\n4. 관절 부위(팔꿈치 등)에 주사를 맞는 경우 가능한 구부리거나 움직이지 않도록 합니다.", "G2": "1. 주사 부위가 점점 붓고 붉어지거나 통증이 심해진다면 의료진의 처방이 필요합니다.\n2. 통증이 있다면 처방받은 소염진통제를 복용합니다.\n3. 주사 부위를 청결하고 건조하게 유지합니다.\n4. 항암 약제에 따라 조치(냉찜질 또는 온찜질 등)가 다르므로 주사가 샌 경우에는 반드시 의료진과 상의합니다. \n   • '독소루비신(아드리아마이신)', '다우노루비신', '에피루비신' 등의 약제를 투여받은 경우에는 냉찜질을 해봅니다. \n     - 혈관을 수축시켜 약물이 다른 조직으로 퍼지는 것을 최소화하며, 국소 염증과 통증을 감소시킵니다. \n     - 1회당 15~20분 정도를 1일 4~6회 적용하여 1-2일 동안 시행합니다.  \n   • '빈크리스틴', '빈블라스틴', 탁산계열('파클리탁셀', '제넥솔', '파덱솔', '아브락산', '탁솔' 등) 약제를 투여받은 경우에는 온찜질을 해봅니다.\n     - 일혈 부위의 혈관을 확장시키고 혈류를 증가시켜 약액의 분산과 흡수를 증가시켜 일혈 부위로부터 누수된 약액이 빨리 퍼지도록 돕습니다. \n     - 1회당 15~20분 정도를 1일 3~4회 적용하여 시행합니다.", "G3": "아래의 경우 의료진의 신속한 진료가 필요합니다. \n   • 상처 부위 감각이 둔해지거나 손가락, 발가락 등의 움직임이 어려운 경우\n   • 38도 이상의 발열\n   • 주사 부위의 극심한 통증 및 발적(붉어짐) \n   • 주사 부위 궤양이나 괴사 등의 심한 손상", "G4": "없음"}, "손발톱 주위 염증": {"G1": "1. 손발톱을 너무 짧게 깎지 않습니다.\n2. 손발톱을 물어 뜯지 않습니다.\n3. 매니큐어, 인조 손톱, 페디큐어는 피합니다.\n4. 손발톱에 자극이나 압력을 주는 행위는 피합니다.  \n5. 설거지할 때 면 장갑을 끼고 그 위에 고무장갑을 낍니다.\n6. 푹신하고 여유 있는 신발을 신습니다.  \n7. 보습 크림을 자주 바르고 장갑 또는 양말을 착용합니다.", "G2": "1. 손발톱에 염증이 생기면 생리 식염수로 세척을 하고 처방받은 항생제 연고를 바릅니다.  \n2. 통증이 있을 때 의료진의 처방하에 진통제, 항생제 치료를 받을 수 있습니다.\n3. 손발톱이 들뜨면서 박리가 있을 때는 손발톱을 짧게 유지하고 밴드로 보호합니다.\n4. 보습 크림을 자주 바릅니다.", "G3": "손톱이나 발톱 주위 염증이 심하여 스스로 일상생활이 어려운 경우 의료진의 진료가 필요합니다.", "G4": "없음"}, "손톱이나 발톱 빠짐": {"G1": "1. 손발톱을 너무 짧게 깎지 않습니다.\n2. 손발톱을 물어뜯지 않습니다.\n3. 매니큐어, 인조손톱, 페디큐어는 피합니다.\n4. 손발톱에 자극이나 압력을 주는 행위는 피합니다.  \n5. 설거지할 때 면장갑을 끼고 그 위에 고무장갑을 낍니다.\n6. 푹신하고 여유 있는 신발을 신습니다.  \n7. 장갑, 양말을 착용합니다.", "G2": "1. 통증이 있는 경우 손발톱에 냉찜질을 합니다.\n2. 손발톱에 염증이 생기면 소독을 하고 항생제 연고를 바릅니다.\n3. 통증이 있을 때, 의료진 처방하에 진통제, 항생제 치료를 받을 수 있습니다.\n4. 손발톱 뿌리 부분의 피부가 빨갛게 변하거나 통증이 있고 진물이 나면 진료가 필요하므로 잘 관찰합니다.", "G3": "없음", "G4": "없음"}, "손톱이나 발톱에 줄이 생기고 울퉁불퉁함": {"G1": "1. 손발톱에 자극이나 압력을 주는 행위를 피합니다.\n2. 설거지를 하는 동안 장갑을 낍니다. (가능할 경우 면 소재의 속장갑도 함께 착용합니다.)\n3. 손발톱 주위에 손톱 영양제 및 보습 크림을 바릅니다.\n4. 손톱을 깨끗하고 짧게 관리합니다. (너무 짧게 자르지 않습니다.)\n5. 매니큐어, 페디큐어를 피합니다.", "G2": "없음", "G3": "없음", "G4": "없음"}, "손톱이나 발톱의 색깔 변화": {"G1": "1. 손발톱에 자극이나 압력을 주는 행위를 피합니다.\n2. 매니큐어, 페디큐어를 피합니다.", "G2": "없음", "G3": "없음", "G4": "없음"}, "팔 또는 다리의 부기": {"G1": "1. 아래와 같이 팔다리를 올린 자세를 취해 봅니다.\n   • 쉴 때는 누워서 베개나 쿠션을 이용해서 다리 부분을 올려 놓기\n   • 의자에 앉을 때에도 다리 밑에 받침대를 두어서 발을 높이기\n   • 너무 오래 서있거나 앉아 있지 말기 \n2. 부종이 있는 부위의 자극을 피합니다.\n   • 여유 있는 옷과 신발 착용\n   • 너무 뜨거운 물에 팔다리를 담그지 않기 \n   • 부은 쪽으로 혈압을 재거나 채혈하지 않기  \n3. 피부를 촉촉하고 청결하게 유지하기 위해 보습제를 자주 바르고 장갑, 양말 등을 꼭 착용하여 피부를 보호합니다.\n4. 음식 조리 시 염분이 들어있는 소금, 간장, 화학조미료 등을 가능한 피하여 짜지 않게 먹어봅니다.", "G2": "1. 아래 사항을 잘 관찰하여 진료 시 의료진에게 알려줍니다. \n   • 몸의 어느 부위가 언제 주로 붓는지\n   • 부기가 점점 심해지는지\n   • 숨이 찬 증상이 있는지\n   • 부은 부위를 손가락으로 눌러보기\n2. 팔, 다리 등 부기가 있는 부위를 눌렀다 떼었을 때 눌려진 부위가 잘 회복이 되지 않으면 의료진의 진료를 받아봅니다.\n3. 가능한 하루 중 일정한 시간에 동일한 체중계로 몸무게를 재고 기록합니다.\n   • 아침에 일어나서 화장실 다녀온 후 체중을 잽니다.", "G3": "1. 부기가 너무 심해서 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우에는 의료진의 신속한 진료가 필요합니다. \n   • 부은 자리에 통증이 심하고, 분비물이 늘어나거나 빨갛게 되고 열감이 있을 때 \n   • 중심정맥관 삽입 부위가 많이 부으면서 압통이나 발열이 있는 경우 \n   • 가만히 있을 때에도 숨이 많이 차서 일상생활을 하기 어려운 경우", "G4": "없음"}, "피부 발진(붉은 두드러기나 염증)": {"G1": "1.  미지근하거나 시원한 물로 목욕합니다.\n2.  순한 비누로 씻고 가볍게 두드려서 말린 후 보습제를 즉시 바릅니다.\n3.  손을 자주 씻고 피부를 긁거나 상처 나지 않도록 유의합니다.\n4.  자극성 세안제 및 세탁세제 사용을 피합니다.\n5.  직접 얼음팩을 피부에 대는 것은 피합니다.\n6.  피부 자극을 줄이기 위해 면으로 된 옷이나, 꽉 끼지 않는 헐렁하고 부드러운 천의 옷을 입도록 합니다.", "G2": "증상 완화를 위해 필요할 경우 항히스타민제 및 국소 스테로이드 로션 등을 처방받을 수 있습니다.", "G3": "아래의 경우에는 의료진의 신속한 진료가 필요합니다. \n   • 체표면의 30% 이상의 피부가 벗겨진 경우 \n   • 물집, 고름, 과녁 모양, 자색 변화가 있는 발진이 전신으로 빠르게 퍼지는 경우\n       ㄴ38도 이상의 발열이나 오한이 동반되는 경우\n** 체표면의 30% 이상 단순 발진만 있는 경우는 응급실 내원 기준이 아닙니다.", "G4": "없음"}, "피부건조": {"G1": "1. 샤워나 목욕 시, 때를 밀지 않는 것이 좋습니다.\n2. 샤워 후 바로 보습제를 바릅니다.\n3. 알코올 성분이 함유된 향수나 화장품을 피합니다.\n4. 피부에 빨갛고 거칠게 갈라진 부위가 없는지, 팔꿈치나 무릎 등 관절 부위에서 피가 나지 않는지 관찰합니다.", "G2": "1. 피부가 건조하면 보습제를 하루에도 여러 번 자주 발라줍니다.\n2. 뜨거운 물로 씻으면 증상이 심해질 수 있으니 시원하거나 미지근한 물로 샤워합니다.\n3. 가려운 부위에 화학 성분의 세제, 향이 강한 비누, 거품 목욕, 알레르기를 유발할 수 있는 성분이 포함된 제품 등은 피합니다.\n4. 면과 같은 천연 섬유로 된 옷을 입습니다.\n5. 방을 시원하게 유지합니다.", "G3": "1. 피부 건조가 심하여 스스로 일상생활이 어려운 정도인 경우 의료진의 진료가 필요합니다.\n2. 광범위하고 지속적인 가려움이 호전되지 않으면, 스테로이드 등의 약제가 도움이 될 수 있습니다.", "G4": "없음"}, "썍쌕거리는 숨소리(천명)": {"G1": "1. 몸을 과도하게 움직이지 말고 안정을 취합니다.\n2. 쌕쌕거리는 숨소리가 언제, 어떤 상황에서 생기는지 기록해 주세요.\n3. 직접 혹은 간접 흡연을 피합니다.\n4. 주 1회 이상의 증상 지속 시 관련 약제를 복용해 볼 수 있습니다.\n5. 이전에 부작용이 있었던 아스피린(혹은 비스테로이드계 소염제 등) 복용을 중단합니다. \n6. 집 먼지 진드기 혹은 다른 알레르기 원인을 없애거나, 쌕쌕거리는 숨소리를 발생시켰던 원인을 피해 봅니다.", "G2": "1. 의료진의 진료를 받습니다. 특히 이전에는 없었는데 새로 쌕쌕거리는 숨소리가 발생한다면 원인을 찾아 치료해 볼 수 있습니다.\n2. 원래 천식 등의 폐 질환이 있었다면 처방받은 기관지 확장제나 흡입형 약물을 사용하고 의료진의 진료를 받으세요.\n3. 폐질환은 없으나 종양으로 인해 기도가 좁아질 수 있는 상황(예: 후두암, 성대암, 두경부암이나 폐암 등)일 수 있으므로 종양에 대한 평가 및 적절한 치료를 위해 의료진의 진료를 받으세요. \n4. 항암치료로 인해 기도가 좁아질 수 있는 상황(예: 항암약물 부작용, 기도 주변의 방사선 치료 등)일 수도 있으므로 의료진의 진료가 필요합니다. \n5. 집먼지 진드기 혹은 다른 알레르기 원인을 없애거나, 쌕쌕거리는 숨소리를 발생시켰던 원인을 피해 봅니다.  \n6. 몸을 과도하게 움직이지 말고 안정을 취합니다.\n7. 쌕쌕거리는 숨소리가 언제, 어떤 상황에서 생기는지 기록해 주세요.\n8. 직접 혹은 간접 흡연을 피합니다.\n9. 주 1회 이상의 증상 지속 시 관련 약제를 복용해 볼 수 있습니다.\n10. 이전에 부작용이 있었던 아스피린(혹은 비스테로이드계 소염제 등) 복용을 중단합니다.", "G3": "1. 쌕쌕거리는 숨소리 관련 증상이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 신속한 진료가 필요합니다.\n2. 아래 증상이 동반될 경우 의료진의 신속한 진료가 필요합니다. \n   • 숨 쉴 때 쌕쌕거리는 소리가 심하여 말을 하기 어렵고, 움직이거나 눕기 어려움 \n   • 숨이 매우 차고 가슴이 답답함 \n   • 어지러운 증상 \n   • 기존에 처방받았던 약을 복용해도 증상이 악화됨 \n   • 산소포화도가 92% 이하로 떨어지는 경우 \n   • 청색증 \n   • 졸리거나 의식이 저하됨 \n   • 호흡 수가 1분에 30회 이상인 경우 \n   • 맥박 수가 1분에 120회 이상인 경우", "G4": "없음"}, "방사선 치료로 피부가 탐": {"G1": "1. 뜨거운 물로 씻거나 욕조 목욕은 피합니다.\n2. 치료 부위에 향수, 오일, 파우더 등을 사용하지 않고, 방사선 치료실에서 안내하는 피부 제품을 사용합니다.\n3. 치료 부위가 극단적인 냉온(예: 온열 패드, 얼음팩 등)에 직접 닿지 않도록 합니다.\n4. 치료 부위를 긁거나 마사지하는 것을 피하고, 반창고를 붙이지 않습니다.\n5. 치료 부위를 강한 태양 광선이나 차가운 바람에 노출시키지 않습니다.\n6. 증상이 악화되거나, 새로운 증상이 발생한 경우에는 의료진에게 알려 원인을 찾습니다.", "G2": "1. 피부가 벗겨진 부위에 필요한 경우 폼 드레싱 제품을 부착할 수 있습니다.  \n2. 고름/악취/심한 통증 및 부종 등의 2차 피부 감염 의심 증상이 있을 때 항생제를 처방받을 수 있습니다.  \n3. 부종, 통증, 진물 등이 동반되면서 피부가 벗겨진 경우 외래 진료를 가능한 한 앞당겨서 진료를 받습니다.", "G3": "1. 부종, 통증, 진물 등이 동반되면서 피부가 벗겨진 경우 가능한 외래 진료를 빨리 받도록 합니다.\n2. 증상이 심하면 방사선 치료를 중단해야 할 수도 있습니다.\n3. 감염되거나 감염 위험이 있는 상처가 있는 경우 전신 또는 국소 항생제를 처방받을 수 있습니다.  \n4. 아래의 증상이 같이 있다면 의료진의 신속한 진료가 필요합니다. \n   • 중증 피부 반응(궤양, 지속적인 출혈, 괴사 등)\n   • 38도 이상의 고열 \n   • 치료 부위의 감염 징후(악취, 화농성 진물, 치료 부위 밖으로 통증과 부종이 심한 경우)", "G4": "1. 부종, 통증, 진물 등이 동반되면서 피부가 벗겨진 경우 가능한 외래 진료를 빨리 받도록 합니다.\n2. 증상이 심하면 방사선 치료를 중단해야 할 수도 있습니다.\n3. 감염되거나 감염 위험이 있는 상처가 있는 경우 전신 또는 국소 항생제를 처방받을 수 있습니다.  \n4. 아래의 증상이 같이 있다면 의료진의 신속한 진료가 필요합니다. \n   • 중증 피부 반응(궤양, 지속적인 출혈, 괴사 등)\n   • 38도 이상의 고열 \n   • 치료 부위의 감염 징후(악취, 화농성 진물, 치료 부위 밖으로 통증과 부종이 심한 경우)"}, "햇빛에 피부가 더 민감해짐": {"G1": "1. 햇빛에 약간 노출되어도 화상을 입을 수도 있으므로 창으로 들어오는 햇빛도 주의합니다.\n2. 10시~3시 사이의 외출 시 햇빛을 가릴 수 있는 옷과 모자를 착용하고 직사광선에 바로 노출되는 것을 피합니다.\n3. 태닝을 피하고 자외선 차단제(SPF 15 이상)를 사용합니다. \n   • ‘게피티닙’, '얼로티닙', '아파티닙', ‘오시머티닙’ 등 항암제를 투여하는 환자는 SPF 30 이상을 사용하세요.\n4. 피부를 자극할 수 있는 물질과의 직접적인 접촉을 피하도록 합니다.\n5. 수포(물집), 발진 등의 생기면 손으로 만지지 않도록 합니다.", "G2": "1. 증상 조절을 위해 국소 스테로이드 연고와 진통제를 처방받을 수 있습니다.\n2. 증상의 중증도에 따라 약제의 용량을 조절할 수 있으니 의료진과 상의합니다.\n3. 예정된 외래 진료 일정을 가능하면 앞당겨 의료진에게 해당 부위를 보여주고 진료를 받습니다.\n4. 햇빛에 약간 노출되어도 화상을 입을 수도 있으므로 창으로 들어오는 햇빛도 주의합니다.\n5. 10시~3시 사이의 외출 시 햇빛을 가릴 수 있는 옷과 모자를 착용하고 직사광선에 바로 노출되는 것을 피합니다.\n6. 태닝을 피하고 자외선 차단제(SPF 15 이상)를 사용합니다. \n   • ‘게피티닙’, '얼로티닙', '아파티닙', ‘오시머티닙’ 등 항암제를 투여하는 환자는 SPF 30 이상을 사용하세요.\n7. 피부를 자극할 수 있는 물질과의 직접적인 접촉을 피하도록 합니다.\n8. 수포(물집), 발진 등이 생기면 손으로 만지지 않도록 합니다.", "G3": "진통제나 스테로이드 처방이 필요할 수 있으므로 즉시 외래를 방문하거나 신속한 의료진의 진료가 필요합니다.", "G4": "없음"}, "눈물 흘림증": {"G1": "1. 따뜻한 찜질을 시행하고, 인공 눈물을 넣어 봅니다.\n2. 비루관(눈물관) 주변 마사지를 하루 2~3회 시행합니다.  \n3. 미지근한 물로 자주 세안을 합니다.\n4. 실내의 습도를 유지하고 자주 환기합니다.\n5. 충분한 수분 섭취를 합니다.", "G2": "1. 증상이 지속될 때는 병원을 방문하여 의료진과의 상담이 필요합니다.\n2. 따뜻한 찜질을 시행하고, 인공 눈물을 넣어 봅니다.\n3. 비루관(눈물관) 주변 마사지를 하루 2~3회 시행합니다.  \n4. 미지근한 물로 자주 세안을 합니다.\n5. 실내의 습도를 유지하고 자주 환기합니다.\n6. 충분한 수분 섭취를 합니다.", "G3": "1. 아래 증상이 동반되면 의료진의 진료가 필요합니다. \n   • 눈 주변의 심한 감염(누낭염 등)\n   • 시력이 매우 떨어짐 \n   • 눈물이 지속적으로 나며 앞을 보기 어려움 \n   • 시야 결손 \n   • 지속적으로 이물감이 느껴짐 \n   • 통증 및 발적을 동반한 안검 부종\n   • 한쪽 눈 또는 두 눈의 안구 돌출\n   • 눈을 움직일 때 동반되는 통증\n   • 두 개로 보임(복시)\n   • 색각 저하 \n2. 아래 증상이 동반되면 의료진의 신속한 진료가 필요합니다.  \n   • 한 눈 또는 두 눈의 갑작스러운 실명 \n   • 눈 주변의 심한 감염(누낭염 등)\n   • 갑자기 심한 안구 통증 발생", "G4": "없음"}, "얼굴 혹은 가슴의 여드름이나 뾰루지": {"G1": "1. 피부를 촉촉하게 유지해 주세요.(알코올 성분이 없는 로션 사용 권고)\n2. 손을 자주 씻고 피부를 긁거나 상처가 나지 않게 주의합니다.\n3. 여드름을 손으로 만지거나 짜지 마세요. 2차 감염이 발생할 수 있습니다.\n4. 심한 경우 항생제 연고를 바르는 것만으로도 도움이 될 수 있습니다.", "G2": "1. 여드름, 뾰루지가 심한 경우 경구 항생제 및 스테로이드 연고 등이 증상 완화에 도움이 됩니다. \n2. 다음의 증상이 나타나는 경우, 약제의 용량을 줄이거나 중단해야 할 수 있으므로 의료진과 상의해 주세요.\n   • 여드름이 심하여 고름이 나는 경우\n   • 전신 발열이나 오한이 생기는 경우\n   • 증상이 빠른 속도로 악화되는 경우\n   • 피부에 작은 물집이 띠를 이루며 통증이 있는 경우", "G3": "1. 아래의 경우 의료진의 진료가 필요합니다.\n   • 발진에 물집이나 고름집이 같이 발생하는 경우\n   • 체표면의 30% 이상 여드름이나 뾰루지가 발생한 경우\n   • 일상생활에 방해가 되는 경우\n   • 얼굴 혹은 혀의 부종 동반\n   • 피부의 통증 혹은 괴사 동반\n   • 자반성 발진 혹은 과녁 모양의 발진 동반\n   • 피부 감염력이 있는 사람에게 노출되었거나 대상포진이 의심되는 경우\n   • 증상이 빠른 속도로 악화되는 경우 \n   • 물집 주변의 피부가 정상처럼 보이나 표피를 손가락으로 밀면 쉽게 밀리면서 벗겨지는 양상\n   • 구강, 안구, 항문 외음부 및 생식기 점막 미란(헐어서 문드러짐)\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 38도 이상의 발열이나 오한이 동반되는 경우\n   • 물집, 고름집, 과녁 모양, 자색 변화가 동반한 발진이 전신으로 빠르게 퍼지는 경우", "G4": "없음"}, "두드러기(피부가 가렵고 붉게 올라옴)": {"G1": "1. 미지근한 물로 샤워하고, 보습제나 칼라민 로션을 바릅니다.\n2. 과도한 스트레스, 알코올, 맵고 자극적인 음식, 카페인을 피합니다.", "G2": "두드러기 증상 조절을 위해 처방받은 저용량 스테로이드 로션을 바르거나 항히스타민제를 복용할 수 있습니다.", "G3": "1. 두드러기와 함께 혈관 부종(얼굴/입술/성기 부종) 및 호흡곤란, 복통 등을 동반하는 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 혈관 부종에 의한 호흡곤란이 있는 경우\n   • 피부 전체에 붉은 반점과 가려움증(두드러기)과 함께 아래 증상을 동반한 경우\n      - 눈, 입술, 혀 및 인후 부종이 있는 경우\n      - 쌕쌕거림 및 호흡 \n      - 복부 경련, 배가 아픔, 구토\n      - 혈압 저하로 인한 현기증 및 실신", "G4": "없음"}, "평소와 달리 피부색이 까매짐": {"G1": "1. 자외선 차단제를 수시로 바르고 햇빛이 강한 시간대의 외출은 피합니다.\n2. 뜨거운 물로 샤워하는 것은 피하고, 보습제를 자주 발라 주세요.", "G2": "1. 자외선 차단제를 수시로 바르고 햇빛이 강한 시간대의 외출은 피합니다.\n2. 뜨거운 물로 샤워하는 것은 피하고, 보습제를 자주 발라 주세요.", "G3": "없음", "G4": "없음"}, "음식이나 음료의 맛을 느끼기 어려움": {"G1": "1. 환기를 자주 시켜 실내에 음식 냄새가 나지 않게 합니다.\n2. 자극적인 음식을 피하세요.\n3. 자극적이지 않은 양념이나 소스를 사용해 보세요.", "G2": "1. 환기를 자주 시켜 실내에 음식 냄새가 나지 않게 합니다.\n2. 냄새가 거의 없는 식품(죽, 토스트 등)을 먹어 봅니다. \n3. 수분이 적은 음식, 기름기 없는 음식을 시도해 봅니다.\n4. 갑작스러운 미각 손실 시 의료진과 상담해 봅니다.", "G3": "없음", "G4": "없음"}, "숨 참": {"G1": "1. 마음을 편안하게 가라앉힌 후 심호흡을 해봅니다.\n2. 편한 옷을 입고, 본인에게 편한 자세를 취합니다.\n3. 호흡곤란이 있었던 상황을 기록해 봅니다.\n4. 호흡곤란을 일으켰던 요인이 있었다면, 다음에는 그것을 피해 봅니다.\n   • 찬 공기 직접 쐬기, 흡연, 습도가 너무 높거나 낮은 경우 등", "G2": "1. 호흡곤란으로 진료 후 처방받은 약물을 잘 복용합니다.\n2. 아래의 경우 의료진의 진료가 필요합니다.\n   • 갑자기 호흡곤란이 생겼거나, 증상이 더 심해진 경우\n   • 갑작스런 흉통이 같이 생긴 경우\n   • 노란색 가래가 나오거나 38도 이상의 발열\n   • 통증 등 다른 증상이 같이 있는 경우\n   • 혈액이 섞인 가래가 나오는 경우\n   • 얼굴이나 몸이 붓는 경우\n   • 쌕쌕거리는 숨소리가 나는 경우", "G3": "1. 호흡곤란(숨 참)이 심해 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 갑자기 심해진 호흡곤란으로 말하기 어렵거나 바로 누울 수 없는 경우\n   • 노란색 가래나 발열 등 감염의 징후가 있는 경우\n   • 다량의 혈액이 섞인 가래가 동반된 경우\n   • 얼굴이나 몸의 부기가 발생한 경우\n   • 갑작스러운 흉통이 발생한 경우", "G4": "없음"}, "몸이 춥고 떨림": {"G1": "1. 항암제 투여 후 춥고 떨리면서 열이 나면, ‘호중구 감소성 발열’일 확률이 높으므로 체온을 자주 재서 38도 이상이면 신속히 병원 진료를 받습니다. \n   • ‘호중구 감소성 발열’인 경우 검사와 항생제 주사가 필요하므로 병원에 신속히 방문합니다.\n2. 감염을 의심할 만한 다른 증상(구내염, 기침, 호흡곤란, 춥고 떨림, 가래, 피부나 조직의 발적(붉어짐), 부기, 통증, 배뇨 시 통증 및 불편감 등)이 있다면, 의료진의 진료가 필요합니다.\n3. 중심 정맥관, 기타 신체에 삽입된 기구 등이 있다면 삽입 부위가 붓거나 아프거나 붉어졌는지 관찰해보고 의료진에게 말해 주세요.\n4. 열감이 있을 때나 으슬으슬 추울 때는 2~3시간마다 체온을 측정해서 기록하세요.\n5. 고열이 지속되는 경우, 미온수나 시원한 수건으로 닦습니다.\n6. 열이 나면 수분 손실이 커지므로 물이나 음료를 충분히 섭취하세요.", "G2": "몸이 춥고 떨림(오한)이 심한 경우 의료진의 진료가 필요합니다.", "G3": "1. 몸이 춥고 떨림(오한)이 심한 경우 의료진의 진료가 필요합니다.\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n   • 심한 두통\n   • 호흡곤란 \n   • 의식 변화  \n   • 감염(구내염, 기침, 호흡곤란, 춥고 떨림, 가래, 피부나 조직의 발적(붉어짐), 부기, 통증, 배뇨 시 통증 및 불편감 등)\n   • 탈수 증상(기력이 급격히 떨어짐, 소변량 감소 등)이 동반된 경우\n   • 쇼크 증상 \n   • 1시간 이상 36도 이하 혹은 38도 이상이 지속되는 경우 \n   • 중심정맥관의 감염 증상 및 징후가 있는 경우", "G4": "없음"}, "불면증(잠들기 어려움, 자주 깸, 일찍 깸)": {"G1": "1. 불면증이 생기게 하는 약물을 복용하고 있는지 의료진에게 확인해 봅니다.\n2. 매일 같은 시간에 자고 일어나도록 노력합니다.\n3. 낮 동안 햇볕을 쬐고, 가능한 수준의 활동을 유지하는 것이 도움이 될 수 있습니다.\n4. 저녁 시간에 카페인이나 담배, 자극적인 식사, 음주 등을 피합니다.\n5. 자기 전 목욕, 향기 요법, 발 마사지, 책 읽기, 잔잔한 음악이나 오디오북 듣기, 따뜻한 우유 마시기 등이 도움이 될 수 있습니다.\n6. 수면 전 스마트폰 사용을 자제합니다.\n7. 통증 등 수면을 방해하는 신체 증상을 먼저 관리하는 게 좋습니다.", "G2": "수면 장애가 일상생활에 불편감을 초래한다면 의료진과 약물 치료에 대해 상의해 볼 수 있습니다.", "G3": "잠들기 어렵거나, 자주 깨거나, 일찍 깨는 증상이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.", "G4": "없음"}, "심장이 두근거리고 빨리 뜀(심계항진)": {"G1": "1. 복용 중인 천식 치료제, 고혈압약, 부정맥 약제 등이 두근거림을 일으킬 수도 있으므로 의료진과 상의합니다.\n2. 두근거림을 유발했던 원인이 있었다면 피해 봅니다.  \n3. 카페인이 많이 든 음료(커피, 홍차 등)나 술을 피합니다.\n4. 충분한 휴식을 취합니다.", "G2": "아래의 경우 의료진의 신속한 진료가 필요합니다. \n   • 기존에 부정맥 진단을 받은 적이 있는 환자가 심한 증상이 발생할 경우\n   • 안정 시에도 증상이 지속되면서 숨참이나 가슴 통증, 혹은 어지러움이 같이 있는 경우", "G3": "없음", "G4": "없음"}, "손발이 저리거나 감각이 둔해짐": {"G1": "1. 경미한 증상인 경우 시간이 지나면 회복되므로 특별한 치료가 필요하지는 않습니다.\n2. 감각이 약간 저하되어 자극이 잘 느껴지지 않으면 다칠 위험이 있으므로 손발을 보호하고 자극을 피하는 게 우선입니다.\n  • 집안일을 하거나 도구 사용 시 장갑을 낍니다.\n  • 가능한 맨발을 피하고 부드럽고 발목이 느슨한 면양말을 신는 게 좋습니다. \n  • 신발은 여유 있고 편한 운동화를 착용해 보세요.\n  • 손발을 부드럽게 마사지하거나 주먹을 쥐었다 폈다를 반복해 보세요.", "G2": "1. 일상생활 유지에 어려움이 있는 경우에는 재활치료가 도움이 될 수 있습니다.\n2. 차거나 뜨거운 것을 구별하기 어려운 경우 온수기의 온도를 낮추고, 가능하면 다른 사람에게 물 온도 확인을 부탁하거나 온도계를 사용하세요.\n3. 요리, 청소, 집안 정리 등 도움이 필요한 부분에 대해 보호자와 상의합니다.\n4. 신경독성 항암제를 이용한 치료를 받고 있는 경우, 약물 용량 조절에 대해 주치의와 상의할 수 있으니 진료 시 말씀해 주세요.\n5. 발의 위치 감각이 잘 느껴지지 않을 때에는 운전하지 마세요.", "G3": "1. 손발 저림이 심하여 스스로 일상생활이 어려운 경우에는 의료진의 진료가 필요합니다.\n2. 손발 저림이 심하면 말초신경독성을 유발하는 항암제의 중단이 고려될 수도 있으므로 진료 시 말씀해 주세요.\n3. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 갑자기 힘이 빠져서 서거나 움직이기 어려운 정도의 극심한 통증이나 마비가 생긴 경우", "G4": "없음"}, "흐려 보임": {"G1": "1. 흐려 보임이 지속된다면 의료진과의 상담이 필요합니다.\n2. 흐려 보이는 증상과 함께 눈이 뻑뻑하고 건조하다면 인공눈물을 사용합니다.", "G2": "1. 흐려 보이는 증상을 일으킬 만한 약제를 복용하고 있지 않은지 의료진과 상의합니다.\n2. 흐려 보임이 지속된다면 의료진과의 상담이 필요합니다.", "G3": "1. 흐려 보이는 증상이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 아래 증상이 동반되면 의료진의 진료가 필요합니다. \n   • 시야결손이 발생되었을 때(시야의 일부분이 보이지 않는 것 등)\n   • 지속적으로 이물감이 느껴질 때 \n   • 통증 및 발적을 동반한 안검(눈꺼풀)의 부종 \n   • 한 눈 또는 두 눈의 안구 돌출 \n   • 두 개로 보이는 경우(복시) \n   • 색각 저하(색맹 혹은 색약 등)  \n3. 아래 증상이 동반되면 의료진의 신속한 진료가 필요합니다. \n  • 갑자기 한 눈 또는 두 눈이 실명된 경우\n  • 갑자기 심한 안구통증이 발생한 경우", "G4": "없음"}, "집중력의 문제": {"G1": "1. 평소 궁금했던 질문들을 적어 놓고 정기 진료 시 의료진에게 물어 봅니다.\n2. 항암치료 후 집중력 저하 등이 올 수 있으므로 아래 설명대로 진행해 봅니다.\n•  매일 비슷한 일정으로 생활하고 규칙적으로 신체 활동을 하면 신체에도 좋고, 피로를 줄이며, 인지 기능에 도움이 됩니다. \n•  여러 가지 일을 한 번에 하지 않습니다. \n•  주의 산만해지게 만드는 일들은 보호자가 대신할 수 있도록 요청하세요. \n•  약속, 할 일, 중요한 날짜 등은 기록을 해놓고, 자주 잃어버리는 물건들은 일정한 장소를 정해서 보관하세요. \n•  언제, 어떤 상황에 집중력의 문제가 있었는지 기록해 보고, 중요한 대화나 약속이 있을 때에는 그런 상황을 피합니다. \n•  수업 듣기, 퍼즐 풀기, 새로운 언어 배우기 등 다양한 활동을 시도해 보세요.", "G2": "1. 가스레인지 사용, 냉난방이나 냉온수 조절 등 안전상 유의해야 하는 경우 알람 장치 등을 미리 설치합니다.\n2. 평소 궁금했던 질문들을 적어두고 정기 진료 시 의료진에게 물어 봅니다.  \n3. 항암치료 후 집중력 저하 등이 올 수 있으므로 아래 설명대로 실천해 보세요.\n  •  매일 규칙적으로 생활하고 신체 활동을 하면 신체에도 좋고 피로를 줄이며, 인지 기능에 도움이 됩니다. \n  •  여러 가지 일을 한 번에 하지 않습니다. \n  •  주의를 산만하게 만드는 일은 보호자가 대신할 수 있도록 요청하세요. \n  •  약속, 할 일, 중요한 날짜 등은 기록하고, 자주 잃어버리는 물건들은 일정한 장소를 정해서 보관하세요. \n  •  언제, 어떤 상황에 집중력의 문제가 있었는지 기록해 보고, 중요한 대화나 약속이 있을 때에는 그런 상황을 피합니다. \n  •  수업 듣기, 퍼즐 풀기, 새로운 언어 배우기 등 다양한 활동을 실천해 보세요.\n4. 집중력 문제로 환자 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다. \n  •  밥 먹기, 화장실 가기, 옷 입기 등 스스로를 돌보는 일이 불가능한 경우 \n  •  자해나 타해의 위험성이 있는 경우", "G3": "1. 집중력 문제가 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n• 밥 먹기, 화장실 가기, 옷 입기 등 스스로를 돌보는 일이 불가능한 경우\n• 자해나 타해의 위험성이 있는 경우\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n• 의식저하와 함께 의사소통이 안되는 경우\n• 혼수, 심한 두통, 경련, 구토가 있는 경우\n• 갑자기 인지 기능 저하와 혼돈이 발생한 경우", "G4": "없음"}, "기억력 문제": {"G1": "1. 평소 궁금했던 질문들을 적어두고 정기 진료 시 의료진에게 물어 봅니다.\n2. 항암치료 후 기억력 저하 등이 올 수 있으므로 아래 설명대로 실행해 봅니다.\n   • 매일 규칙적으로 생활하고, 신체 활동을 하면 신체에도 좋고 피로를 줄이며, 인지 기능에 도움이 됩니다. \n   • 여러 가지 일을 한 번에 하지 않습니다. \n   • 주의를 산만하게 만드는 일은 보호자가 대신할 수 있도록 요청하세요. \n   • 약속, 할 일, 중요한 날짜 등은 기록하고, 자주 잃어버리는 물건들은 일정한 장소를 정해서 보관하세요.\n   • 언제, 어떤 상황에 집중력의 문제가 있었는지 기록해 보고, 중요한 대화나 약속이 있을 때에는 그런 상황을 피합니다. \n   • 수업 듣기, 퍼즐 풀기, 새로운 언어 배우기 등 다양한 활동을 시도해 보세요.", "G2": "1. 가스레인지 사용, 냉난방이나 냉온수 조절 등 안전상 유의해야 하는 경우 알람 장치 등을 미리 설치합니다.\n2. 평소 궁금했던 질문들을 적어두고 정기 진료 시 의료진에게 물어 봅니다.  \n3. 항암치료 후 기억력 저하 등이 올 수 있으므로 아래 설명대로 실행해 봅니다.\n   • 매일 규칙적으로 생활하고, 신체 활동을 하면 신체에도 좋고 피로를 줄이며, 인지 기능에 도움이 됩니다. \n   • 여러 가지 일을 한 번에 하지 않습니다. \n   • 주의를 산만하게 만드는 일은 보호자가 대신할 수 있도록 요청하세요. \n   • 약속, 할 일, 중요한 날짜 등은 기록하고, 자주 잃어버리는 물건들은 일정한 장소를 정해서 보관하세요. \n   • 언제, 어떤 상황에 집중력의 문제가 있었는지 기록해 보고, 중요한 대화나 약속이 있을 때에는 그런 상황을 피합니다. \n   • 수업 듣기, 퍼즐 풀기, 새로운 언어 배우기 등 다양한 활동을 시도해 보세요.\n4. 기억력 문제로 환자 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다. \n   • 밥 먹기, 화장실 가기, 옷 입기 등 스스로를 돌보는 일이 불가능한 경우 \n   • 자해나 타해의 위험성이 있는 경우", "G3": "1. 기억력 문제가 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n   • 밥 먹기, 화장실 가기, 옷 입기 등 스스로를 돌보는 일이 불가능한 경우\n   • 자해나 타해의 위험성이 있는 경우\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 의식저하와 함께 의사소통이 안되는 경우\n   • 혼수, 심한 두통, 경련, 구토가 있는 경우\n   • 갑자기 인지 기능 저하와 혼돈이 발생한 경우", "G4": "없음"}, "불안감": {"G1": "1. 자신의 질병, 치료 과정, 부작용에 대해 정확히 알면 불안을 줄이는 데 도움이 됩니다.\n2. 적절한 심신 이완 활동을 합니다.\n   • 휴식, 천천히 호흡하기, 명상, 스트레칭, 마사지, 가벼운 산책, 음악 듣기, 그림, 독서 등  \n3. 불안을 악화시키는 아래 요인들을 피합니다. \n   • 수면 부족, 통증이 조절되지 않음, 카페인 섭취, 니코틴 금단 증상 등\n4. 가족이나 주위 사람들에게 감정을 솔직하게 이야기합니다.", "G2": "1. 아래의 경우 의료진의 진료가 필요합니다.\n   • 불안감이 심해 스스로 일상생활을 하기 어려운 경우\n   • 불안감이 심해 숨쉬기 힘들거나 빠르게 숨 쉬는 경우 \n   • 안절부절못하고 초조하거나, 땀을 많이 흘리는 경우\n2. 질병과 치료, 부작용에 대해 정확히 알면 불안이 줄어듭니다.\n3. 적절한 심신 이완 활동을 합니다.\n   • 휴식, 천천히 호흡하기, 명상, 스트레칭, 마사지, 가벼운 산책, 음악 듣기, 그림, 독서 등  \n4. 불안을 악화시키는 아래 요인들을 피합니다. \n   • 수면 부족, 통증 조절 안됨, 카페인 섭취, 니코틴 금단 증상, 음주 등\n5. 가족이나 주위 사람들에게 감정을 솔직하게 이야기합니다.", "G3": "1. 아래의 경우 의료진의 진료가 필요합니다.\n   • 불안감이 심해 스스로 일상생활을 하기 어려운 경우\n   • 불안감이 심해 숨 쉬기 힘들거나 빠르게 숨 쉬는 경우 \n   • 안절부절못하고 초조하거나, 땀을 많이 흘리는 경우\n2. 죽는 것이 더 낫겠다는 생각이 들거나 스스로를 해칠 것 같은 생각이 자주 드는 경우 의료진의 신속한 진료가 필요합니다.", "G4": "없음"}, "슬픔이나 우울함": {"G1": "1. 우울감을 잘 관리하면 삶의 질 향상, 치료 순응도 향상으로 치료 결과를 더 좋게 할 수 있으므로 전문가(주치의, 정신건강의학과, 심리상담가 등)의 도움을 받아 봅니다.\n2. 암환자에게 우울은 흔히 경험할 수 있는 감정이므로 감추려고 하기 보다는 편안한 사람들에게 자신의 감정을 진솔하게 이야기하는 것이 도움이 됩니다.\n3. 가벼운 신체활동을 하거나 주의를 전환해 봅니다.\n4. 균형 잡힌 식사를 하고, 금주하고, 건강한 수면을 취합니다.", "G2": "우울이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.", "G3": "1. 우울이 심하여 스스로 일상생활을 하기 어려운 경우 의료진의 진료가 필요합니다.\n2. 죽는 것이 더 낫겠다는 생각이 들거나 스스로 자신을 해칠 것 같은 생각이 자주 드는 경우 의료진의 신속한 진료가 필요합니다.", "G4": "없음"}, "몸 냄새": {"G1": "1. 샤워나 목욕을 한 후 보습 크림을 자주 바릅니다.\n2. 복장을 청결하게 하고 침구류를 자주 세탁합니다.\n3. 생선, 양파 등 냄새가 강한 음식을 피해 봅니다.\n4. 방안의 온도를 지나치게 높게 유지하지 않습니다.\n5. 물을 자주 마십니다.", "G2": "1. 샤워나 목욕을 한 후 보습 크림을 자주 바릅니다.\n2. 복장을 청결하게 하고 침구류를 자주 세탁합니다.\n3. 생선, 양파 등 냄새가 강한 음식을 피해 봅니다.\n4. 방안의 온도를 지나치게 높게 유지하지 않습니다.\n5. 물을 자주 마십니다.", "G3": "없음", "G4": "없음"}, "출혈(구토, 가래, 소변, 대변, 상처부위)": {"G1": "없음", "G2": "없음", "G3": "해당 부위의 출혈이 의심되면 의료진의 진료가 필요합니다.", "G4": "없음"}, "탈모": {"G1": "1. 머리카락이 빠지기 전 또는 빠지기 시작할 때 머리카락을 짧게 자르는 것이 좋습니다.\n2. 머리를 너무 자주 감을 필요는 없지만 두피를 청결하게 유지해야 합니다.\n3. 샴푸 후 머리는 공기 중에 자연스럽게 말리거나 찬 바람으로 말립니다.\n4. 심한 탈모가 예상되는 경우에는 잘 어울리는 가발, 모자, 스카프 등을 미리 준비합니다.\n5. 탈모 후 느낌을 의료진 또는 가족들에게 말해주고, 탈모를 경험하는 다른 환자들과도 얘기를 나눠보는 게 도움이 됩니다.", "G2": "1. 아래와 같이 두피를 잘 관리합니다.\n   • 너무 자주 감을 필요는 없지만 두피를 청결하게 유지합니다.\n   • 머리카락이 빠지는 동안에는 빗살이 넓고 부드러운 빗으로 살살 빗습니다.\n   • 순한 성분의 샴푸로 머리를 감은 후 모발을 비비지 말고 가볍게 두드려서 말립니다.\n   • 민감해진 두피에 자극이 되므로 헤어스프레이, 파마, 염색 등의 화학물질 사용을 피합니다.\n   • 헤어드라이어, 고데기와 같은 열기구의 사용을 되도록 줄입니다.\n2. 머리카락이 빠진 후는 아래와 같이 관리합니다.\n   • 가발, 헤어피스, 스카프, 모자, 랩 또는 기타 머리 덮개로 보호하고 체온을 유지하도록 합니다.\n   • 외출 시에 모자, 스카프 등을 꼭 사용합니다.\n   • 완전히 탈모된 후에는 두피를 보호하기 위하여 선크림(자외선차단제)을 바릅니다.\n   • 가발이나 헤어피스 착용 시 크기가 머리에 여유 있게 맞고 두피에 자극이 없도록 합니다. \n   • 아주 부드러운 베개 덮개를 사용합니다.\n3. 탈모 후 느낌을 의료진 또는 가족들에게 말해주고, 탈모를 경험하는 다른 환자들과도 이야기를 나눠보는 게 도움이 됩니다.", "G3": "없음", "G4": "없음"}, "욕창": {"G1": "1. 피부를 매일 꼼꼼히 관찰하고 체위 변경을 자주 하면서 뼈 돌출 부위 등 욕창이 잘 생기는 부위가 붉어졌는지 확인합니다.  \n2. 해당 부위에 추가적인 압력이나 마찰이 가해지지 않도록 합니다.\n3. 보습제를 자주 바릅니다.\n4. 예방적으로 폼 드레싱 제품을 붙일 수 있습니다.\n5. 적어도 이틀에 한 번 정도 해당 부위를 소독합니다.", "G2": "1. 폼 및 습윤 드레싱을 부착합니다.  \n2. 상처 부위에 괴사 조직이 있다면 제거해야 할 수 있으니 의료진의 진료가 필요합니다.\n3. 피부를 매일 꼼꼼히 관찰하고 체위 변경을 자주 하면서 뼈 돌출 부위 등 욕창이 잘 생기는 부위가 붉어졌는지 확인합니다.\n4. 해당 부위에 추가적인 압력이나 마찰이 가해지지 않도록 합니다.\n5. 적어도 이틀에 한 번 정도 해당 부위를 소독합니다.", "G3": "1. 욕창 관리와 괴사 조직 발생 시 제거를 위하여 성형외과 진료가 필요합니다.\n2. 매일 소독해야 하며, 진물이 적으면 생리식염수로 소독한 뒤 상처를 관찰하기 쉬운 투명 필름으로 붙이고, 진물이 나온다면 진물을 흡수할 수 있는 제품을 사용하여 소독합니다.\n3. 해당 부위에 추가적인 압력이나 마찰이 가해지지 않도록 합니다.\n4. 아래의 경우에는 의료진의 신속한 진료가 필요합니다. \n   • 38도 이상의 고열을 동반하는 상처 감염 \n   • 심부 조직(예: 근육, 힘줄, 뼈 등) 손상 시 \n   • 극심한 통증 시", "G4": "1. 욕창 관리와 괴사 조직 발생 시 제거를 위하여 성형외과 진료가 필요합니다.\n2. 매일 소독해야 하며, 진물이 적으면 생리식염수로 소독한 뒤 상처를 관찰하기 쉬운 투명 필름으로 붙이고, 진물이 나온다면 진물을 흡수할 수 있는 제품을 사용하여 소독합니다.\n3. 해당 부위에 추가적인 압력이나 마찰이 가해지지 않도록 합니다.\n4. 아래의 경우에는 의료진의 신속한 진료가 필요합니다. \n   • 38도 이상의 고열을 동반하는 상처 감염 \n   • 심부 조직(예: 근육, 힘줄, 뼈 등) 손상 시 \n   • 극심한 통증 시"}, "소변볼 때 아프고 화끈거림": {"G1": "1. 소변볼 때 아프고 화끈거림 증상만으로 병원이나 응급실에 내원할 필요는 없습니다.\n2. 하루에 2L 정도의 물을 섭취합니다.\n3. 소변이 마려울 때 참지 않습니다.\n4. 아래의 경우 의료진의 진료가 필요합니다.\n   • 소변 색이 변하거나 피가 나오는 경우\n   • 소변볼 때 허리 뒤나 아랫배에 통증이 있을 경우\n   • 소변에서 좋지 않은 냄새가 나고 색이 탁한 경우\n   • 소변을 보고 난 뒤 금방 또 마려운 느낌이 드는 경우\n   • 평소보다 너무 자주 소변을 보는 경우\n   • 힘을 줘도 소변이 나오지 않는 경우\n   • 38도 이상의 열이 있거나 오한이 있는 경우\n   • 1~2일 지나도 증상이 호전되지 않고, 악화되는 경우\n5. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n   • 심각한 정도의 급성 통증 \n   • 옆구리 통증이 심할 때\n   • 고열(38도 이상)\n   • 10시간 이상 배뇨가 어려울 때 \n   • 혈뇨", "G2": "없음", "G3": "없음", "G4": "없음"}, "소변이 갑자기 마려움": {"G1": "급하게 외래에 내원할 필요는 없으나, 외래 문진 시 의료진에게 문의하세요.\n1. 케겔 운동을 시도해 봅니다.\n2. 적당한 물을 섭취해 봅니다.\n3. 알코올, 커피, 차 등 카페인이 함유된 제품은 자제합니다. \n4. 일상생활에 지장을 주지 않는 정도의 긴박뇨(갑자기 마려운 소변)는 추운 날씨나 일상생활에서 긴장하는 경우 나타날 수 있으므로 하복부나 회음부를 따뜻하게 하거나 스트레스를 관리하면 도움이 될 수 있습니다.", "G2": "급하게 외래에 내원할 필요는 없으나, 외래 문진 시 의료진에게 문의하세요.\n1. 케겔 운동을 시도해 봅니다.\n2. 적당한 물을 섭취해 봅니다.\n3. 알코올, 커피, 차 등 카페인이 함유된 제품은 자제합니다. \n4. 일상생활에 지장이 있는 경우 의사와 상의를 하여 약제 투여를 고려해야 합니다.", "G3": "없음", "G4": "없음"}, "빈뇨(소변을 자주 봄)": {"G1": "급하게 외래에 내원할 필요는 없으나, 외래 문진 시 의료진에게 문의하세요.\n1. 방광을 자극하는 커피나 탄산음료의 섭취를 줄입니다. \n2. 수분 섭취는 시간에 맞춰 조정합니다.\n3. 니코틴은 방광 근육을 자극시킬 수 있으므로 금연합니다. \n4. 알코올은 이뇨작용으로 소변량이 증가하여 증상을 악화시킬 수 있으므로 금주하도록 합니다. \n5. 비만한 경우 적절한 운동을 통해 체중 조절을 합니다. \n6. 육류 섭취를 줄이고 야채와 과일 섭취를 늘려서 변비를 예방합니다. \n7. 외출 전과 야간 취침 전 배뇨합니다. \n8. 배뇨 시 통증이 있으면 의료진의 진료가 필요합니다.", "G2": "급하게 외래에 내원할 필요는 없으나, 외래 문진 시 의료진에게 문의하세요 \n1. 아래의 경우 의료진의 진료가 필요합니다. \n   • 소변에 피가 보이는 경우 \n   • 반복적인 요로 감염이 있는 경우\n   • 소변을 봤는데도 다량의 잔뇨가 있는 경우\n   • 배뇨 시 통증이 있는 경우 \n2. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n   • 고열(38도 이상)\n   • 옆구리 통증이 조절이 안되는 경우", "G3": "없음", "G4": "없음"}, "요실금(소변 조절 장애)": {"G1": "가벼운 증상은 치료가 필요하지 않습니다. 다음 외래 내원 시 의료진에게 증상을 이야기해주세요.\n1. 배뇨 시간을 정해 규칙적으로 배뇨합니다.\n2. 방광을 자극하는 음식(알코올, 카페인이 함유된 음료, 매운 음식, 신맛이 나는 주스나 과일류, 인공 감미료, 초콜릿, 시럽, 꿀, 설탕 등)을 피합니다. \n3. 체중을 감량합니다.\n4. 골반저근을 지속적으로 수축 및 이완시켜 괄약근을 강화하는 운동인 골반저근 운동(케겔 운동)을 합니다.", "G2": "1. 가벼운 증상은 치료가 필요하지 않습니다. 다음 외래 내원 시 의료진에게 증상을 이야기해 주세요.\n2. 패드를 지속적으로 사용하고, 약물 치료를 위해 의료진의 진료가 필요할 수 있습니다.", "G3": "1. 아래의 경우 의료진의 진료가 필요합니다.\n   • 씻기, 옷 입기, 화장실 이용, 밥 먹기, 약 먹기 등 스스로를 돌보는 일이 불가능한 경우\n   • 열이 나거나 배뇨 시 통증이 지속되는 경우\n   • 10시간 이상 소변을 못 보는 경우\n   • 아랫배가 평소와 다르게 부풀어 오르는 경우\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다.\n   • 지속적으로 기저귀를 한 상태로, 소변을 지리면서 아랫배가 빵빵하게 부풀어 있는 경우", "G4": "없음"}, "불규칙한 생리 주기": {"G1": "1. 가임기 여성에서는 암 치료 중 불규칙한 월경 및 간헐적인 출혈이 발생할 수 있습니다.\n2. 월경 주기와 기간, 양, 출혈 양상을 기록해 둡니다. (대부분의 여성은 한 달에 한 번 정도 생리를 하며, 정상적인 주기는 24일에서 38일입니다.) \n3. 임신, 여성호르몬 변화, 혈액응고인자 부족, 자궁 및 자궁부속기 문제 등 다른 문제가 동반되어 있을 수 있으므로 다음 내원 시 의료진에게 알립니다. \n4. 규칙적인 생활을 하며, 충분한 수면을 취할 수 있도록 합니다. \n5. 건강한 식습관을 유지합니다.\n6. 규칙적인 운동을 하고 적정 체중을 유지합니다.\n7. 과로와 스트레스를 줄입니다.", "G2": "1. 질 출혈의 양이 많거나 비정상적이라면 의사에게 질 출혈의 양과 양상, 응고물의 크기를 알립니다. \n2. 사용한 생리대의 수를 의사에게 알립니다. \n3. 탐폰은 사용하지 않습니다. \n4. 월경 주기와 기간, 양, 출혈 양상에 대해 의료진과 상의합니다.\n5. 질 출혈의 양이 많고 기간이 긴 경우, 빈혈을 유발하는 경우, 통증을 동반하는 경우 및 산부인과적 문제가 동반된 경우에는 약물 치료나 시술, 수술적인 치료가 필요할 수도 있습니다.\n6. 연속 4주기 이상(약 3개월 이상)의 간헐적/불규칙한 월경이 있을 때, 의료진의 진료가 필요합니다. \n   • 이전에 규칙적인 생리를 했으나 3개월 이상 생리가 없을 때\n   • 이전에 규칙적인 생리를 했으나, 점점 생리 주기가 짧아지거나, 길어질 때 \n   • 생리양이 1~2시간마다 패드나 탐폰을 변경할 정도로 많을 때\n   • 생리할 때 큰 덩어리의 혈액이 나올 때 \n   • 하복통, 어지러움, 피곤함, 호흡곤란, 두통, 심계항진\n   • 임신 가능성이 있을 때\n7. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n   • 1시간 안에 패드 2장이나 탐폰 2개를 완전히 적실 정도의 출혈이 지속적으로 있을 때, 또는 그 정도의 출혈이 있는 경우\n   • 심각한 복통이 동반되는 경우\n   • 고열이 지속되는 경우", "G3": "없음", "G4": "없음"}, "갑작스럽게 생리가 중단됨": {"G1": "없음", "G2": "1. 가임기 여성에서는 암 치료 중 월경 주기가 불규칙해질 수 있으며, 항암화학약물 치료 또는 항호르몬 요법을 받는 동안 무월경을 경험하거나 치료 후에도 조기 폐경을 경험할 수 있습니다.\n2. 스트레스와 과로를 피하고, 규칙적인 생활을 하며, 충분한 수면을 취합니다.\n3. 내원 시 의료진에게 무월경 관련 내용을 알립니다.\n4. 이전에 3개월 이상 생리를 하지 않았다면, 의료진의 진료가 필요합니다. \n   • 임신 가능성을 생각해 보세요\n   • 가슴이나 얼굴에 여드름이 심하거나 털이 많아지거나 눈에 띄게 굵어진 경우\n   • 심한 체중 증가나 감소\n   • 열성 안면 홍조를 포함한 갱년기 증상\n   • 새로운 두통이 생기거나 시력이 나빠지는 경우\n   • 모유 분비\n   • 심한 스트레스\n5. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n  • 심각한 복통이 동반되는 경우\n  • 심각한 질 출혈이 동반되는 경우\n  • 고열이 지속되는 경우", "G3": "없음", "G4": "없음"}, "평소와 다른 질 분비물": {"G1": "1. 질 세척(뒷물)을 하지 않습니다.\n2. 팬티라이너를 매일 사용하지 않습니다.\n3. 위생용 여성 스프레이, 파우더, 린스, 향이 나는 목욕 용품을 사용하지 않습니다.\n4. 뜨거운 탕 목욕, 거품 목욕을 하지 않습니다.\n5. 따뜻한 물이나 비누 성분이 없는 세정제를 사용해서 손으로 씻어 봅니다.\n6. 합성 섬유로 된 속옷을 피하고, 면 소재의 속옷을 착용하고, 몸을 꽉 조이거나 딱 붙는 속옷은 피합니다.\n7. 용변을 본 후에 물로 씻거나 가볍게 두드려 말리고, 물티슈나 향이 나는 화장지를 사용하지 않습니다.\n8. 콘돔을 모든 성행위 동안 정확한 방법으로 일관되게 사용합니다.  \n9. 민간요법 등의 자가 치료는 질 분비물에 대한 증상을 악화시킬 수 있기 때문에 피합니다.", "G2": "1. 아래의 경우 의료진의 진료가 필요합니다.\n   • 질액 분비로 패드나 탐폰이 필요한 경우\n   • 외음부, 질구 또는 음순의 가려움증이 있는 경우\n   • 외음부 피부의 발적, 작열감, 쓰림 또는 부종이 있는 경우\n   • 거품이 있거나 녹황색 분비물이 있는 경우\n   • 나쁜 냄새가 나는 경우\n   • 피가 섞인 질 분비물이 있는 경우\n   • 성교나 배뇨 시 통증이 있는 경우\n   • 복부 또는 골반 통증이 있는 경우\n\n2. 아래의 경우 의료진의 신속한 진료가 필요합니다. \n   •  심각한 복통이 동반될 때\n   •  심각한 질 출혈이 같이 있을 때 \n   •  고열이 지속될 때", "G3": "없음", "G4": "없음"}}, "contents": {"입 마름": [["카드", "입 마름 예방을 위한 생활 수칙"], ["블로그", "입 마름 증상의 특징과 회복 기간"], ["카드", "입마름에 도움이 되는 음식!"], ["카드", "입마름으로 진료가 필요한 경우!"]], "입안이 헐어서 아프거나 목이 따가운 증상(구내염)": [["영상", "구내염은 무엇인가요?"], ["영상", "구내염 완화를 위한 가글 시작!"], ["카드", "구내염 지속 시 도움이 되는 음식"]], "삼키기 어려움": [["블로그", "삼키기 어려움이란?"], ["블로그", "삼키기 어려움 극복을 위한 운동법"]], "메스꺼움": [["영상", "메스꺼움/구토 완화 생활 지침"], ["영상", "메스꺼움/구토는 언제 발생하나요?"], ["블로그", "메스꺼움 지속 시, 도움되는 음식"], ["영상", "메스꺼움/구토 완화 생활 수칙"], ["영상", "메스꺼움을 다스리는 마음 지침"]], "구토(음식을 토함)": [["영상", "메스꺼움을 다스리는 슬기로운 식사"], ["영상", "메스꺼움/구토는 언제 발생하나요?"], ["블로그", "메스꺼움 지속 시, 도움되는 음식"], ["영상", "메스꺼움/구토 완화 생활 수칙"], ["영상", "메스꺼움을 다스리는 마음 지침"]], "속 쓰림": [["블로그", "속쓰림을 다스리는 식생활 지침"], ["블로그", "속쓰림 발생 시 주의 사항"], ["카드", "속쓰림을 다스리는 체중 관리 팁"]], "변비": [["영상", "변비 증상의 완화 방법!"  쉴 때 쌕쌕거리는 소리가 조금 나요.", "가만히 휴식을 취할 때도 숨 쉴 때 쌕쌕거리는 소리가 나요.", "쌕쌕거리는 소리가 심하고, 숨이 차서 말을 하기 어렵거나, 움직이거나 눕기가 힘들어요."]}, {"q": "쌕쌕거리는 숨소리로 인하여 일상생활에 어느 정도의 어려움이 있나요?", "a": ["일상생활에 영향은 없어요.", "일상적 생활 활동에 어려움이 있어요.\n※ 일상적 생활 활동이란 학교나 학원에 가기, 숙제하기, 방 정리하기, 게임하기, 친구들과 놀기 등을 말해요.", "심한 호흡기 증상(숨참, 기침, 가래 등)이 같이 있어서 스스로 돌보는 행동이 어려워요. \n※ 스스로 돌보는 행동이란 혼자 세수하기, 혼자 옷 입기, 혼자 화장실 가기, 혼자 밥 먹기 등을 말해요."]}], "방사선 치료로 피부가 탐": [{"q": "방사선 치료 부위의 피부가 벗겨진 것은 얼마나 심한가요?", "a": ["피부에 마른 각질이 일어나요. \n※ 각질은 피부나 두피에 생기는 굳은살이나 벗겨지는 하얀 껍질을 말해요.", "주로 피부가 접히는 부위에만 진물이 나면서 벗겨졌어요.\n※ 진물은 상처에서 나오는 맑은 액체를 말해요.", "피부가 접히는 부분 말고도 다른 부분 피부까지 진물이 나고 빨갛게 벗겨졌어요.", "피부에서 진물이 나오고 빨갛게 벗겨진 피부의 색깔이 검게 변하고, 까지거나 파인 상처가 생겼어요."]}, {"q": "방사선 치료 부위의 피부 변화는 얼마나 심한가요?", "a": ["피부가 약간 붉어졌어요.", "피부가 꽤 많이 붉어졌어요.", "치료 부위 피부가 부어 있어요.", "붉게 벗겨진 부위가 조금만 스쳐도 피가 나요.", "손을 대지 않아도 벗겨진 피부에서 피가 저절로 나요."]}], "햇빛에 피부가 더 민감해짐": [{"q": "햇빛을 받아 생긴 피부의 붉은 반점(점이나 얼룩)은 몸 전체에서 어느 정도를 차지하나요?", "a": ["몸 전체 중에 10분의 1도 안 되는 부분이에요.", "몸 전체의 10분의 1에서 3분의 1 사이 정도로 넓게 퍼져 있어요.", "몸 전체의 3분의 1보다 넓게 퍼졌어요."]}, {"q": "피부의 붉은 반점(점이나 얼룩)과 함께 나타난 통증, 물집 등 다른 증상은 얼마나 심한가요?", "a": ["붉은 반점이 있지만 통증은 없어요.", "붉은 반점이 있으면서 만질 때 통증이 있어요.", "붉은 반점이 있으면서 심한 통증과 함께 물집도 생겼어요."]}], "눈물 흘림증": [{"q": "눈물 흘림증은 얼마나 심한가요?", "a": ["별로 심하지 않아요.", "보통이고 힘들긴 해도 참을 만해요."]}, {"q": "눈물 흘림증으로 인해 시력은 얼마나 떨어졌나요?", "a": ["시력에 변화가 거의 없어요.", "시력이 조금 떨어졌어요.", "시력이 많이 떨어졌어요."]}], "얼굴 혹은 가슴의 여드름이나 뾰루지": [{"q": "여드름이나 뾰루지가 생긴 부분은 몸 전체에서 어느 정도를 차지하나요?", "a": ["몸 전체 중에 10분의 1도 안 되는 부분이에요.", "몸 전체의 10분의 1에서 3분의 1 사이 정도로 넓게 퍼져 있어요.", "몸 전체의 3분의 1보다 넓게 퍼졌어요."]}, {"q": "여드름이나 뾰루지와 함께 나타나는 증상(가려움증, 눌렀을 때의 통증 등)은 얼마나 심한가요?", "a": ["없거나 혹은 별로 심하지 않아요.", "보통이고 힘들긴 해도 참을 만해요.", "너무 심해서 힘들어요."]}, {"q": "여드름이나 뾰루지로 인해 일상생활에 어려움이 있나요?", "a": ["일상생활에 영향은 없어요.", "학교생활이나 친구 관계에서 많이 신경 쓰여요.", "일상적 생활 활동에 어려움이 있어요.\n※ 일상적 생활 활동이란 학교나 학원에 가기, 숙제하기, 방 정리하기, 게임하기, 친구들과 놀기 등을 말해요.", "스스로 돌보는 행동이 어려워요. \n※ 스스로 돌보는 행동이란 혼자 세수하기, 혼자 옷 입기, 혼자 화장실 가기, 혼자 밥 먹기 등을 말해요."]}], "두드러기(피부가 가렵고 붉게 올라옴)": [{"q": "두드러기(피부가 가렵고 붉게 올 예요. 또 코 안에 딱지가 생기거나 염증이 생겨서 피가 날 수 있어요.", "딸꾹질": "딸꾹질은 숨을 쉬게 도와주는 근육(횡격막)이 갑자기 움직이면서 목소리 나오는 곳(성대)이 닫혀서 '딸꾹'하는 소라기 나는거에요.", "기침": "기침은 목이나 폐 속에 먼지나 가래 같은 것이 있을 때, 그것을 밖으로 내보내려고 몸이 자연스럽게 하는 반응이에요.", "열": "체온이 37.4~37.9도이면 1~2시간 후 다시 재서 38도 이상이면 증상을 다시 기록해주세요.", "쉽게 멍이 듦(검거나 푸른 자국)": "멍은 피부 속의 작은 혈관이 다쳐서 피가 새어나오고, 그 때문에 피부가 검거나 푸르게 보이는 거예요.", "입마름": "입마름은 침이 마르거나 끈끈해지는 것을 말해요.", "입안이 헐어서 아프거나 목이 따가운 증상(구내염)": null, "삼키기 어려움": null, "메스꺼움": "메스꺼움이란 배 속이 울렁거리거나 토하고 싶은 느낌이 지속되는 증상을 말해요.", "속쓰림": "속쓰림은 위에서 식도쪽으로 산성을 띤 위 내용물이 올라오면서 가슴 통증과 타는 듯한 느낌이 동반되는 증상을 말해요.", "구토(음식을 토함)": "구토란 위의 내용물을 식도와 입안을 거쳐 갑자기 입 밖으로 배출하는 증상을 말해요.", "복통": "복부 통증(아랫배)을 말해요. 0점은 전혀 통증이 없는 상태이고 10점은 상상할 수 있는 가장 심한 통증을 의미합니다.", "두통": "0점은 전혀 통증이 없는 상태이고 10점은 상상할 수 있는 가장 심한 통증을 의미합니다.", "근육통": "0점은 전혀 통증이 없는 상태이고 10점은 상상할 수 있는 가장 심한 통증을 의미합니다.", "관절통": "0점은 전혀 통증이 없는 상태이고 10점은 상상할 수 있는 가장 심한 통증을 의미합니다.", "통증": "0점은 전혀 통증이 없는 상태이고, 10점은 상상할 수 있는 가장 심한 통증을 의미합니다.", "어지러움": "어지러움은 넘어질 것 같거나 내 몸이나 주변이 움직이는 느낌을 말해요.", "입술 가장자리가 트거나 갈라짐": null, "소화 불량": "주로 음식을 소화하기 힘들 때, 배가 불편하거나 아픈 느낌을 말해요. 가슴이 쓰리거나, 속이 메스껍고 토할 것 같거나, 배가 부른 느낌이 함께 나타날 수도 있어요.", "복부 팽만(가스가 찬 것처럼 배가 빵빵해짐)": null, "식욕감소": "식욕 감소는 먹고자 하는 의욕이 떨어지고 이로 인하여 음식섭취가 줄어들거나 전혀 먹지 못하는 증상을 말해요.", "소변색의 변화": "다음의 원인들로 인해 소변색의 변화가 있을 수 있어요.\n- 갈색 소변은 설사, 구토, 많이 땀을 흘리거나 열이 날 때 물을 많이 잃어 몸이 마를 때 또는 오랫동안 음식을 거의 먹지 않고 물도 적게 마실 때 생길 수 있어요.\n- 붉은색 소변은 항암제(아드리아마이신이나 독소루비신)를 맞은 직후나, 소변에 피가 섞여 나올 때 생길 수 있어요.", "변을 참기 어려움": null, "눈 앞이 번쩍거림": "갑자기 눈 앞에 불빛이 비치는 것 같은 느낌을 말해요.", "눈 앞에 점이나 선(부유물)이 떠다님": null, "귀에서 소리가 남(이명)": null, "예상치 못하게, 과도하게 밤낮 관계없이 땀이 남": "체온상승이나 격렬한 운동 여부와 상관없이 신체의 특정 부위에서 땀이 과다하게 많이 나는 것을 말해요.", "예상치 못하게 땀이 덜 나는 것": null, "피부 가려움": "피부가 가려운 것은 피부가 아프거나, 몸 속 신호가 잘못 전달돼서 생기거나, 몸이 아프거나 마음이 힘들 때 생길 수도 있어요.", "변비": "변비는 장이 천천히 움직여서 대변이 딱딱해지고, 배변이 힘들어 보통 일주일에 2번 이하로 변을 볼 때를 말해요.", "무른 변(설사)": "설사는 변이 묽어지고, 변을 보는 횟수가 평소보다 많이 늘어날 때를 말해요.", "목소리 변화": null, "쉰 목소리": null, "얼굴 화끈거림": "얼굴 화끈거림은 얼굴, 목, 가슴에 갑자기 열이 나면서 순간적으로 얼굴이 붉어지는 느낌이 드는 증상을 말해요.", "피로, 피곤함 또는 기운 없음": "피로감은 암 때문에 진단이나 치료를 받은 후, 힘든 운동을 하지 않아도 계속 기운이 없고 쉽게 지치는 느낌이 드는 증상을 말해요.", "손이나 발에 발진이 생겨 갈라지거나 벗겨짐, 빨개지고 통증이 있음(수족증후군)": "수족증후군은 항암제를 맞은 후 손이나 발의 피부가 붉어지고 붓거나, 피부가 갈라지거나 심하면 벗겨지면서 아픈 증상을 말해요", "항암주사 맞은 부위 통증, 부기, 빨개짐": null, "손발톱 주위 염증": "특정 항암제를 맞은 후 손톱이 깨지거나, 손톱 주변이 붓고, 손톱 가장자리 주름에 염증이 생겨 아픈 증상을 말해요.", "손톱이나 발톱 빠짐": null, "손톱이나 발톱에 줄이 생기고 울퉁불퉁함": null, "손톱이나 발톱의 색깔 변화": null, "팔 또는 다리의 부기": "팔이나 다리가 부어서 예전보다 굵어 보이고, 무겁게 느껴지며, 눌렀을 때 누른 자국이 남는 것을 말해요.", "피부 발진(붉은 두드러기나 염증)": "피부 발진은 피부가 빨개지거나, 물집이 생기거나, 염증이 생기고, 갈라지거나 벗겨지는 등 피부 모양이나 느낌이 변한 상태를 말해요.", "피부건조": "피부 건조는 피부에 기름과 물이 부족해서 생기는 증상이에요. 심하면 피부가 갈라지고 거칠어지며, 그 틈으로 세균이 들어가 염증이 생길 수도 있어요.", "쌕쌕거리는 숨소리(천명)": "천명음은 숨길이 좁아질 때, 숨을 쉴 때 휘파람처럼 쌕쌕거리는 소리가 나는 것을 말해요.", "방사선 치료로 피부가 탐": null, "햇빛에 피부가 더 민감해짐": null, "눈물 흘림증": "눈물이 심하게 많이 만들어지거나, 눈물이 흐르는 길이 막혀서 눈물이 많이 흘러넘치는 것을 말해요.", "얼굴 혹은 가슴의 여드름이나 뾰루지": null, "두드러기(피부가 가렵고 붉게 올라옴)": null, "평소와 달리 피부색이 까매짐": null, "음식이나 음료의 맛을 느끼기 어려움": null, "숨 참": "숨참은 숨 쉬기가 어렵고 숨이 차며, 숨 쉴 때 불편하거나 힘이 드는 증상을 말해요.", "몸이 춥고 떨림": "몸이 춥거나 떨림은 열과 함께 생길 수 있어요.", "불면증(잠들기 어려움, 자주 깸, 일찍 깸)": "불면 증상은 잠들기 어렵거나, 잠자는 중 자주 깨거나, 잠들었지만 일찍 깨는 등의 증상을 말해요.", "심장이 두근거리고 빨리 뜀(심계항진)": "심계항진은 심장박동이 불규칙적으로 뛰거나, 빠르고 더 강하게 느껴지는 불편한 느낌을 말해요.", "손발이 저리거나 감각이 둔해짐": "손발 감각이 약한(둔한) 증상은, 손이나 발을 만졌을 때 느낌이 약해지거나, 무디게 느껴져서 물건을 집거나 단추를 채우는 동작이 어렵게 느껴지거나, 손이나 발이 내 것이 아닌 것처럼 느껴지는 것을 말해요.", "흐려 보임": "'흐려 보임'은 사물이 흐려보이거나 이전보다 시력이 나빠진 증상을 말해요.", "집중력의 문제": "집중력의 문제는 항암제를 맞고 인지 기능의 변화가 와서 기억력이 떨어지고, 어떤 일에 집중을 잘 못하면서, 일 처리에 어려움이 있고, 머리에 안개가 낀 것 같은 멍한 느낌이 있는 증상을 말해요.", "기억력 문제": "기억력 문제란 항암제를 맞고 인지 기능의 변화가 와서 기억력이 떨어지고, 어떤 일에 집중을 잘 못하면서, 일 처리에 어려움이 있고, 머리에 안개가 낀 것 같은 멍한 느낌이 있는 증상을 말해요.", "불안감": "불안은 뚜렷한 이유가 없는데도 괜히 무섭고 두려운 느낌이 들고, 그 때문에 마음이 안절부절해지거나 초조해지거나 긴장되고, 심장이 빨리 뛰거나 숨이 차는 증상을 말해요.", "슬픔이나 우울함": "우울은 기분이 가라앉고, 예전처럼 즐겁거나 재미있다고 느끼지 못하는 상태를 말해요.", "몸 냄새": null, "출혈(구토, 가래, 소변, 대변, 상처부위)": "부위별 출혈의 설명을 꼭 읽어주세요!", "탈모": "탈모는 항암제를 맞은 뒤 머리카락이나 몸의 털이 부분적으로나 전부 빠지는 증상을 말해요. 이때 두피가 따갑거나, 머리카락이 얇아지고 건조해질 수도 있어요.", "욕창": "   return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;};
const dayDiff = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);

  const code=n.charCodeAt(n.length-1); const jong=(code-0xAC00)%28>0;
  if(pair==='은는')return n+(jong?'은':'는'); if(pair==='이가')return n+(jong?'이':'가');
  return n+(jong?'아':'야');
};
